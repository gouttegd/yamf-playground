id: https://example.org/tag-types/internal
name: internal-tag
description: >-
  A schema that illustrates how to emulate Serde’s “internally tagged enums” in
  LinkML.
created_by: orcid:0000-0002-6095-8718
see_also:
  - https://serde.rs/enum-representations.html#internally-tagged

prefixes:
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
  internal: https://example.org/tag-types/internal#
default_prefix: internal
imports:
  - linkml:types
default_range: string

classes:
  MessageList:
    description: An object that holds a list of messages of variable types.
    tree_root: true
    attributes:
      messages:
        description: The list of messages.
        range: Message
        multivalued: true

  Message:
    description: This is the base class for all messages.
    notes:
      - This class could be abstract, but it does not really matter for this
        demonstration.
    attributes:
      id:
        description: The ID of this message.
      type:
        description: The type designator.
        notes:
          - The presence of this slot is all that is needed to support
            “internally tagged enums” in LinkML. The slot is the “internal tag”.
        designates_type: true

  Request:
    description: A message that is a request.
    is_a: Message
    attributes:
      method:
        description: The method used by the request.
      params:
        description: The parameters used by the request.
        multivalued: true

  Response:
    description: A message that is a response.
    is_a: Message
    attributes:
      result:
        description: The result of the request.
