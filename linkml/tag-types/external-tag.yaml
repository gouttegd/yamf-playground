id: https://example.org/tag-types/external
name: external-tag
description: >-
  A schema that tries to illustrates how to emulate Serde’s “externally
  tagged enums” in LinkML.

  This does not really work, however. It can achieve something _similar_
  to Serde’s externally tag enums, but not quite exactly the same thing.
created_by: orcid:0000-0002-6095-8718
see_also:
  - https://serde.rs/enum-representations.html#externally-tagged

prefixes:
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
  external: https://example.org/tag-types/external#
default_prefix: external
imports:
  - linkml:types
default_range: string

classes:

  MessageList:
    description: >-
      An object that holds a list of messages of variable types.
    tree_root: true
    attributes:
      messages:
        description: The list of messages.
        range: MessageWrapper
        multivalued: true
        inlined_as_list: false
        notes:
          - >-
            The range cannot be directly a Message object. We need an
            intermediate “wrapping” class to allow the type designator
            (“tag”) to be “external” to the actual data structure rather
            than “internal” to it.

  Message:
    description: This is the base class for all messages.
    notes:
      - >-
        This class could be abstract, but it does not really matter for
        this demonstration.
    attributes:
      id:
        description: The ID of this message.

  WrappedRequest:
    description: A message that is a request.
    is_a: Message
    attributes:
      method:
        description: The method used by the request.
      params:
        description: The parameters used by the request.
        multivalued: true

  WrappedResponse:
    description: A message that is a response.
    is_a: Message
    attributes:
      result:
        description: The result of the request.

  MessageWrapper:
    description: A wrapper object for a message.
    notes:
      - >-
        This class does not represent any “real” object in the modelled
        domain. Its only purpose is to allow the message list to be
        serialized as an “externally tagged enum”. Likewise for all its
        descendants.
    attributes:
      type:
        description: The type designator
        designates_type: true
        key: true
        notes:
          - >-
            Making the type designator also the key slot makes this
            class eligible for “simple dict” inlining (since it has only
            one other non-key slot), which is what is needed to place
            the tag outside (“externally”) of the data structure.
      content:
        description: The actual message object.
        range: Message

  Request:
    description: A wrapper object for a request message.
    is_a: MessageWrapper
    slot_usage:
      content:
        range: WrappedRequest
        notes:
          - >-
            We refine the range so that a Request wrapper can only
            contain (“wrap“) a message of type WrappedRequest.

  Response:
    description: A wrapper object for a response message.
    is_a: MessageWrapper
    slot_usage:
      content:
        range: WrappedResponse
        notes:
          - >-
            We refine the range so that a Response wrapper can only
            contain (“wrap“) a message of type WrappedResponse.
