id: https://schemas.incenp.org/ome/v1/units/
name: ome-units
title: OME Units Schema
description: >-
  A schema that provides enumerations for the various types of units used
  throughout the OME model.
created_by: orcid:0000-0002-6095-8718

prefixes:
  omeunits: https://schemas.incenp.org/ome/v1/units/
  orcid: https://orcid.org/
default_prefix: omeunits

