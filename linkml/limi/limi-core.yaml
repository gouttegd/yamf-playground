id: https://example.invalid/limi/v02-10/core
name: limi-core
title: LiMi Core Schema
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Core” part of the LiMi model.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
  - linkml:types
  - limi-core-units
  - limi-core-annotations
  - limi-core-hardware
  - limi-core-settings
  - limi-core-experiment
default_prefix: limi
default_range: string

slots:
  id:
    description: A Unique identifier for this entity.
    identifier: true

  name:
    description: A User-defined Name for this entity.

  object_type:
    description: The type designator for all designated classes.
    designates_type: true
    range: uri
    notes:
      - This must be a global slot rather than a class-level attribute because
        of bugs in some components of LinkML-Py.

classes:
  LiMiObject:
    description: The base class for all classes defined in the LiMi Schema.
    abstract: true
    notes:
      - This class is intended to facilitate customization of the LiMi Schema,
        by allowing another schema to (i) import this schema (or another schema
        that imports it) and (ii) redefine this class as needed.

  LiMiMapEntry:
    description: An entry in a generic table of key/value pairs.
    attributes:
      key:
        description: The name of the entry.
        key: true
      value:
        description: The value of the entry.

  LiMiBinData:
    description: A blob of arbitrary binary data, serialised as a Base64-encoded string.
    is_a: LiMiObject
    attributes:
      compression:
        description: The compression scheme used to encode this data, if any.
        range: LiMiCompression
        ifabsent: LiMiCompression(none)
      value:
        description: The binary blob itself.
        range: LiMiBase64Binary

types:
  LiMiBase64Binary:
    description: A blob of arbitrary binary data, serialized as a Base64-encoded string.
    notes:
      - Ideally this type should be a builtin type in LinkML.
    see_also:
      - https://github.com/linkml/linkml/issues/3977
    uri: xsd:base64Binary
    typeof: string

  LiMiHexBinary:
    description: A blob of arbitrary binary data, serialized as a hexadecimal
      (Base16-encoded) string.
    notes:
      - Ideally this should be a builtin type in LinkML.
    uri: xsd:hexBinary
    typeof: string

enums:
  LiMiCompression:
    description: Available compression schemes.
    permissible_values:
      zlib:
      bzip2:
      none:
