id: https://example.invalid/limi/v02-10/core
name: limi-core
title: LiMi Core Schema
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Core” part of the LiMi model.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
imports:
  - linkml:types
  - limi-core-units
  - limi-core-annotations
  - limi-core-hardware
  - limi-core-settings
default_prefix: limi
default_range: string

slots:
  id:
    description: A Unique identifier for this entity.
    identifier: true

  name:
    description: A User-defined Name for this entity.

  object_type:
    description: The type designator for all designated classes.
    designates_type: true
    range: uri
    notes:
      - This must be a global slot rather than a class-level attribute because
        of bugs in some components of LinkML-Py.

classes:
  LiMiObject:
    description: The base class for all classes defined in the LiMi Schema.
    abstract: true
    notes:
      - This class is intended to facilitate customization of the LiMi Schema,
        by allowing another schema to (i) import this schema (or another schema
        that imports it) and (ii) redefine this class as needed.

  LiMiExperimenter:
    description: A person who performed an imaging experiment.
    notes:
      - FIXME It is unclear whether this class is actually desired. The LiMi
        model’s spreadsheets do not define it, but many elements in there do
        have an “ExperimenterRef”, which is supposed to reference an
        “Experimenter” that has been described elsewhere. Those references seem
        like another remnant of the OME model. For what it’s worth, my take is
        that, if references to persons are still deemed useful, they should be
        done using externally defined identifiers (typically ORCIDs) and NOT
        using a class like this one.
    slots:
      - id
    attributes:
      first_name:
        description:
          First name, sometimes called christian name or given name or forename.
      last_name:
        description: Last name, sometimes called surname or family name.
      middle_name:
        description: Any other names.
      email:
        description: The person’s email address.
      user_name:
        description: The person’s user name (in a Unix or database sense).
      institution:
        description: The organizing structure the person belongs to.

  LiMiMapEntry:
    description: An entry in a generic table of key/value pairs.
    attributes:
      key:
        description: The name of the entry.
        key: true
      value:
        description: The value of the entry.
