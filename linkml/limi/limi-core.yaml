id: https://example.invalid/limi/v2-10/core
name: limi-core
title: LiMi Core Schema
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Core” part of the LiMi
  model.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
imports:
  - linkml:types
  - limi-core-light-sources
  - limi-core-units
default_prefix: limi
default_range: string


slots:

  id:
    description: A Unique identifier for this entity.
    identifier: true

  name:
    description: A User-defined Name for this entity.

  object_type:
    description: The type designator for all designated classes.
    designates_type: true
    range: uri
    notes:
      - >-
        This must be a global slot rather than a class-level attribute
        because of bugs in some components of LinkML-Py.


classes:

  LiMiObject:
    description: >-
      The base class for all classes defined in the LiMi Schema.
    abstract: true
    notes:
      - >-
        This class is intended to facilitate customization of the LiMi
        Schema, by allowing another schema to (i) import this schema (or
        another schema that imports it) and (ii) redefine this class as
        needed.

  LiMiManufacturerSpecs:
    description: >-
      This describes the Manufacturer specifications for a hardware
      component.
    is_a: LiMiObject
    attributes:
      manufacturer:
        description: >-
          The company, research group or individual who built or
          manufactured this hardware.
      model:
        description: >-
          The Model name or any other designation the Manufacturer uses
          for this component.
      catalog_number:
        description: >-
          The Catalog, Part of Serial Number used by the Manufacturer to
          uniquely identify this component.
      lot_number:
        description: >-
          The Lot Number used by the Manufacturer to refer to a specific
          production batch or lot for this component.

  LiMiInstrument:
    description: >-
      This class describes the Instrument used to capture an image. It
      is primarily a container referring to the list of hardware
      components in a given Microscope.
    notes:
      - >-
        The attributes for this class are described in a separate mixin
        because the entire class is defined across several LiMi modules.
    is_a: LiMiManufacturerSpecs
    mixins:
      - LiMiInstrumentCoreMixin
    extra_slots:
      allowed: true

  LiMiInstrumentCoreMixin:
    description: Core-level attributes for the LiMiInstrument class.
    mixin: true
    slots:
      - id
      - name
    attributes:
      stand:
        description: >-
          The core structure of this Microscope, which might also be
          referred to as its Body.
        range: LiMiMicroscopeStand
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      light_sources:
        description: The Light Source(s) available for this Instrument.
        range: LiMiLightSource
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

  LiMiMicroscopeStand:
    description: The core structure of a Microscope.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
      - object_type
    attributes:
      type:
        description: >-
          The general category to which this Microscope belongs.
        range: LiMiMicroscopeType
        required: true
        notes:
          - >-
            Shouldn’t that be an attribute of the Instrument rather than
            of the MicroscopeStand?
      origin:
        description: The origin of this microscope stand.
        range: LiMiMicroscopeOriginType
      eyepiece_field_number:
        description: >-
          The diaphragm size of the Microscope eyepiece expressed in mm.
        range: float

  LiMiInvertedMicroscope:
    description: An inverted Microscope Stand.
    is_a: LiMiMicroscopeStand

  LiMiWavelengthRange:
    description: >-
      A range of Wavelength a device is designed for, according to its
      Manufacturer.
    is_a: LiMiObject
    attributes:
      peak_wavelength:
        description: >-
          The nominal Wavelength associated with the peak response rate
          of this device.
        range: float
      peak_wavelength_unit:
        description: The unit associated with the Peak Wavelength value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      cut_on:
        description: >-
          The wavelength below which the response rate is below 50%.
        range: float
      cut_on_unit:
        description: The unit associated with the Cut On value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      cut_off:
        description: >-
          The wavelength below which the response rate is below 50%.
        range: float
        notes:
          - >-
            FIXME: Shouldn’t that be the wavelength _above_ which the
            response rate is below 50%?
      cut_off_unit:
        description: The unit associated with the Cut Off value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      wavelength_profile_file:
        description: >-
          A file containing the Wavelength profile of this hardware
          component.
        notes:
          - >-
            FIXME: The model describes that as a "File Annotation",
            which is quite a OMERO-specific concept. We need a mechanism
            to allow either storing arbitrary data or referring to
            external files.

  LiMiObjective:
    description: >-
      The Microscope's Objective lens consists of a lens, its mount, and
      any associated parts. It is the part of the imaging system, which
      forms a primary image of the object, either alone or in conjunction
      with a tube lens. The Objective typically consists of a compound
      lens consisting of several simple lenses (elements), usually
      arranged along a common axis.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      magnification:
      lens_na:
        description: >-
          The Magnification of the Objective as specified by the
          Manufacturer - i.e., 60 represents a 60X lens.
        range: float
      correction:
        description: >-
          The type of optical correction (i.e. chromatic correction, or
          flatness correction, etc.) associated with this Objective.
        range: LiMiObjectiveCorrectionType
      immersion_type:
      working_distance:
        description: >-
          The Working Distance of this Objective under normal operating
          conditions. The Working Distance is the distance (in air, or
          in the specified immersion liquid) between the front of an
          Objective and the surface of the cover glass or of th
           specimen if uncovered.
        range: float
      working_distance_unit:
        description: Unit associated with the Working Distance value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      iris:
      calibrated_magnification:
      infinity_corrected:
      contrast_modulation:
      dic:
        description: >-
          Whether (True) the Objective is designed for Differential
          Interference Contrast (DIC) or not (False). DIC is a contrast
          modality due to double-beam interference in which two waves
          that fall on the object plane or image plane are separated
          laterally by a distance similar to the minimum resolvable
          distance.
        range: boolean
      light_type:
      correction_collar:
      correction_collar_type:
      dipping_medium:
      phase_contrast_designation:
      objective_view_field:
      image_distance:
      front_local_length:
      back_local_length:
      parfocalizing_distance:

  LiMiTransmittanceRange:
    description: >-
      A range of wavelength (also known as a Band) that are transmitted
      by an optical component. This also includes the maximum amount of
      light transmitted.
    is_a: LiMiObject
    attributes:
      wavelength:
        description: >-
          The key Wavelength that characterizes this Transmittance Range
          (also known as Transmission Band). In the case of Bandpass,
          Bandstop, Multipass, or Notch Filters, Wavelength often refers
          to the Central Wavelength of each of the transmission band(s);
          alternatively, in case of a Longpass or a Shortpass Filter,
          Wavelength refers to the CutOn Wavelength (i.e., below which
          there is less then 50% transmittance) or the CutOff Wavelength
          (i.e., above which there is less than 50% transmittance)
          respectively. In the case of Dichroics, Wavelength most
          commonly refers to the Edge Wavelength which might be either
          the CutOn or the CutOff Wavelength depending on individual
          cases.
        range: float
      wavelength_unit:
        description: Unit associated with the Wavelength value.
        range: LiMiLengthUnit
      transmittance:
        description: >-
          The maximum of light this optical component is capable of
          transmitting in this Wavelength Range, at the Peak Wavelength.
          It is represented as a fractional value from 0.0 to 1.0.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      FWHM_bandwidth:
        description: >-
          The width of this Transmittance Range. Specifcally, the Full
          Width at Half Maximum (FWHM) represents the bandwidth of the
          Wavelength spectrum curve mesured between those points whose
          transmission amplitude is 50% of the maximum.
        range: float
        minimum_value: 0.0
      FWHM_bandwidth_unit:
        description: Unit associated with the FWHM Bandwidth value.
        range: LiMiLengthUnit


enums:

  LiMiMicroscopeType:
    description: >-
      The general category to which a Microscope belongs.
    permissible_values:
      Compound:
      Custom made:
      Dissection:
      Electrophysiology:
      Light sheet:
      Stereomicroscope:
      Other:

  LiMiMicroscopeOriginType:
    description: >-
      This describes the origin of a Microscope Stand.
    permissible_values:
      Commercial-as is:
        description: >-
          The Microscope Stand was purchased from a Commercial vendor
          and is being used as-is.
      Commercial-custom modified:
        description: >-
          The Microscope Stand was purchased from a Commercial vendor
          and subsequently Modified for a specialized application.
      Custom-built:
        description: >-
          The Microscope Stand was entirely Custom-built from scratch.

  LiMiObjectiveCorrectionType:
    description: >-
      The type of optical correction (i.e. chromatic correction, or
      flatness correction, etc.) associated with an Objective.
    permissible_values:
      Achro:
      Achromat:
      Achroplan:
      Acroplan:
      Apo:
      Apochromat:
      C-Achroplan:
      EF:
      Fl:
      Fluar:
      Fluor:
      Fluotar:
      Lambda:
      N:
      Neofluar:
      NPL:
      Pl:
      Plan:
      Plano:
      PlanApo:
      PlanApochromat:
      PlanFluor:
      PlanNeofluar:
      SuperFluor:
      UPLAN:
      UPlanApo:
      UPlanFl:
      UV:
      VioletCorrected:
      Other:
