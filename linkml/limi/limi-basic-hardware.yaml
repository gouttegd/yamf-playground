id: https://example.invalid/limi/v02-10/basic/hardware
name: limi-basic-hardware
title: LiMi Basic Schema – Hardware Specifications
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Hardware Specifications” section
  of the “Basic” module of the LiMi model.
notes:
  - This schema is not intended to be used on its own. Use limi-basic instead.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  orcid: https://orcid.org/
default_prefix: limi
default_range: string

classes:
  ##############
  # Instrument #
  ##############

  LiMiInstrument:
    description:
      This class describes the Instrument used to capture an image. It is
      primarily a container referring to the list of hardware components in a
      given Microscope.
    notes:
      - This is a redefinition of the class already defined in the Core module,
        to add the attributes specified in the Basic module. As with the
        original definition, all the new attributes are in fact defined in a
        separate mixin, that is inherited by this class.
      - It is unclear whether such a redefinition is actually valid in LinkML.
        According to the LinkML specification, strictly speaking it is not, but
        LinkML’s own reference implementation says it is.
    is_a: LiMiManufacturerSpecs
    mixins:
      - LiMiInstrumentCoreMixin
      - LiMiInstrumentBasicMixin

  LiMiInstrumentBasicMixin:
    description: Basic-level attributes for the LiMiInstrument class.
    mixin: true
    attributes:
      software:
        description:
          A commercial or open-source Software, script, macro, plugin or module
          utilized for any Image Acquisition or Quality Control task related to
          this Instrument.
        range: LiMiSoftware
        multivalued: true
        inlined: true
        inlined_as_list: true
      table:
        description: The Table used to support this Instrument.
        range: LiMiMicroscopeTable
        inlined: true
      environmental_control_devices:
        description: Environmental Control Devices available on this Instrument.
        range: LiMiEnvironmentalControlDevice
        multivalued: true
        inlined: true
        inlined_as_list: true

  #####################
  # Microscope stands #
  #####################

  LiMiUprightMicroscope:
    description: An upright Microscope Stand.
    is_a: LiMiMicroscopeStand

  #######################
  # Software components #
  #######################

  LiMiSoftware:
    description:
      A commercial or open-source Software, script, macro, plugin or module
      utilized for any Image Acquisition or Quality Control task.
    is_a: LiMiObject
    slots:
      - id
      - name
      - object_type
    attributes:
      version:
        description: The Version of this Software.
      developer:
        description:
          The Developer(s) of this Software. In case this is a non-commercial,
          open-source Software, this refers to the name of the individual or
          consortium who developed the Software. In the case of a commercial
          Software, this might refer to the Commercial entity but it can also be
          used to refer to the individual developer, if known.
      website:
        description:
          The URL address of any Website where the Software can be obtained. 
          In case of open-source Software this field should record the URL for the Git repository from which to obtain the source code.
        range: uri
      primary_publication_id:
        description:
          A Unique Identifier for the Primary Publication describing this
          Software. Examples include, Digital Object Identifier (DOI), PubMed
          Central Identifier (PMCID), ArXiv.org ID, etc.
      open_source:
        description:
          Whether this Software is Open-Source (True) or Proprietary (False).
        range: boolean
      macro:
        description:
          Whether this Software is a Macro or a Script (True) or is it a full
          free-standing program (False).
        range: boolean
      build:
        description: The specific build of this Software.
      patch:
        description:
          The version for an optional Patch, HotFix or Update used for this
          Software. A Patch (aka HotFix, or Update) is a set of changes to a
          computer program or its supporting data designed to update, fix, or
          improve it. This includes fixing security vulnerabilities, and other
          bugs, with such patches usually being called bugfixes or bug fixes,
          and improving the functionality, usability, or performance.
      release_date:
        description: The date in which this Software was released.
        range: date
      language:
        description: The computer language in which this Software was developed.
      modules:
        description:
          Software modules that were used in association with this Instrument.
        range: LiMiSoftwareModule
        multivalued: true
        inlined: false

  LiMiAcquisitionSoftware:
    description:
      A commercial or open-source Software, script, macro, plugin or module
      utilized for driving this Instrument during Image Acquisition.
    is_a: LiMiSoftware

  LiMiSoftwareModule:
    description:
      A commercial or open-source software module utilized for any Image
      Acquisition, or Quality Control task.
    is_a: LiMiSoftware

  ####################
  # Microscope table #
  ####################
 # Arnica has filled
  LiMiMicroscopeTable:
    description:
      The Table used to support the Instrument during Image Acquisition.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      multiple_microscopes:
        description: This field records whether (True) or not (False) multiple Microscopes share this Microscope Table. This is relevant because multiple Microscopes using the same table might affect stability and vibrations during Image Acquisition.
        range: boolean
        annotations:
          limi_tier: 2
      type:
        description: This field describes the type of this microscope table
        range: LiMiMicroscopeTableType
        annotations:
          limi_tier: 2
        required: true
      table_width:
        description: The width of this microscope table
        range: float
        annotations:
          limi_tier: 3
      table_width_unit:
        description: Unit associated with the value representing the width of
          the microscope table
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit
      table_depth:
        description: The depth of this microscope table
        range: float
        annotations:
          limi_tier: 3
      table_depth_unit:
        description: Unit associated with the value representing the depth of
          the microscope table
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit

  ################################
  # Environmental control device #
  ################################

  LiMiEnvironmentalControlDevice:
    description:
      An Environmental Control Device available on an Instrument to maintain a
      controlled Image Environment during Image Acquisition.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
       # Arnica has filled
      temperature_control:
        description: This field captures whether this Environmental Control Device provides Temperature control and what type of control it provides. If no Temperature control is provided please enter "None".
        range: LiMiEnvironmentalTemperatureControl
        required: true
      humidity_control:
        description: This field captures whether this Environmental Control Device provides Humidity control and what type of control it provides. If no Humidity control is provided please enter "None".
        range: LiMiEnvironmentalHumidityControl
        required: true
        co2_control:
          description: This field captures whether this Environmental Control Device provides CO2 control and what type of control it provides. If no CO2 control is provided please enter "None".
          range: LiMiEnvironmentalCO2Control
          required: true
        o2_control:
          description: This field captures whether (True) or not (False) this
            Environmental Control Device provides O2 control.
          range: boolean
          annotations:
            limi_tier: 2
          required: true
          notes:
            - DGG - This matches what is described by the spreadsheet, but it doesn’t make much sense in my opinion-- there’s an inherent contradiction in saying that a field belongs to the second tier and saying that it is required.
        vibration_control:
          description: This field captures whether (True) or not (False) this Environmental Control Device provides vibration control.
          range: boolean
          annotations:
            limi_tier: 2
        stand_compatibility:
          description: This field captures what Microscope Stand type this Environmental Control Chamber is compatible with.
          range: LiMiEnvironmentalControlStandCompatibility
          annotations:
            limi_tier: 2
          required: true
        perfusion:
          description: This field captures whether (True) or not (False) this Environmental Control Device supports sample Perfusion.
          range: boolean
          annotations:
            limi_tier: 2
          required: true
        lid_material:
          description: In case this Environmental Control Device consists of a Sample Holder Chamber, this field captures the Material that constitutes the Lid of the Chamber.
          annotations:
            limi_tier: 2
        max_temperature:
          description: This field captures the Maximum Temperature that can be stably maintained by this Environmental Control Device.
          range: float
          annotations:
            limi_tier: 3
          required: true
        max_temperature_unit:
          description: Unit associated with the value representing the maximum temperature that can be stably maintained by this Environmental Control Device.
          range: LiMiTemperatureUnit
          ifabsent: LiMiTemperatureUnit(C)
          annotations:
            limi_tier: 3
          required: true
        min_temperature:
          description: This field captures the Minimum Temperature that can be stably maintained by this Environmental Control Device.
          range: float
          annotations:
            limi_tier: 3
          required: true
        min_temperature_unit:
          description: Unit associated with the value representing the minimum temperature that can be stably maintained by this Environmental Control Device.
          range: LiMiTemperatureUnit
          ifabsent: LiMiTemperatureUnit(C)
          annotations:
            limi_tier: 3
          required: true
        temperature_accuracy:
          description: This field captures the Temperature control Accuracy provided by this Environmental Control Device.
          range: float
          annotations:
            limi_tier: 3
        temperature_accuracy_unit:
          description: Unit associated with the temperature control accuracy provided by this Environmental Control Chamber
          range: LiMiTemperatureUnit
          ifabsent: LiMiTemperatureUnit(C)
          annotations:
            limi_tier: 3
        TTL:
          description: This field captures whether (True) or not (False) this Environmental Control Device can be controlled by a TTL signal.
          range: boolean
          annotations:
            limi_tier: 3

  #################
  # Light sources #
  #################

  LiMiMultiLaserEngine:
    description:
      A Light Source device that contains multiple Lasers built into a single
      box.
    is_a: LiMiLightSource
    attributes:
      single_mode:
        description:
          Whether the output mode of this Multi Laser Engine is single-mode
          (true) or multi-mode (false).
        annotations:
          limi_tier: 2
        range: boolean
      number_of_lasers:
        description:
          The number of lasers lines associated with this Multi Laser Engine.
        annotations:
          limi_tier: 2
        range: integer
        notes:
          - DGG Should not really be needed, as the number can be inferred by
            the number of references in the `lasers` attribute?
      output_port_number:
        description:
          The number of Light Guide ports used as output by this Multi Laser
          Engine.
        annotations:
          limi_tier: 3
        range: integer
      multiport_switch_time:
        description:
          The time it takes for this Multi Laser Engine to switch between Laser
          lines.
        annotations:
          limi_tier: 3
        range: float
      multiport_switch_time_unit:
        description: Unit associated with the Multiport Switch Time value.
        annotations:
          limi_tier: 3
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit(ms)
        notes:
          - AK made up this default unit
      lasers:
        description: The Lasers contained in this Multi Laser Engine.
        range: LiMiLaser
        multivalued: true
        inlined: false

  #########################
  # Light source coupling #
  #########################

  LiMiLightSourceCoupling:
    description:
      A device or method used to couple an available Light Source with a
      Microscope Stand to transfer light to the specimen.
    notes:
      - DGG There does not seem to be a way to associate a light source with a
        light source coupling?
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      # Arnica has filled
      attenuation:
        description: This field reports a measure of the capacity of this Light Source Coupling device to attenuate the Illumination Power of the light passing through measured at the Peak Wavelength and expressed in dB/km.
        range: float
        annotations:
          limi_tier: 2
        required: true
      transmittance:
        description: The maximum amount of light this Light Source Coupling device is capable of transmitting at the Peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        annotations:
          limi_tier: 3
      coupling_lens_ref:
        description: This is a reference to a Lens positioned at the connection between this Light Source coupling element and the Microscope Stand.
        range: LiMiLens
        annotations:
          limi_tier: 2
        inlined: false

  LiMiLightGuide:
    description:
      A Light Guide coupling between the Light Source and the Microscope Stand
      generally consists of a casing enclosing a medium (i.e., typically fiber
      optic) capable of transferring light from the illuminator to the back of
      the Microscope Stand.
    is_a: LiMiLightSourceCoupling
    attributes:
      #Arnica has filled
      type:
        description: This field records the general category of Light Guide used in this case.
        range: LiMiLightGuide
        annotations:
          limi_tier: 2
        required: true
      refractive_index:
        description: This field records the Refractive Index of the material used to construct this Light Guide.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        annotations:
          limi_tier: 3
      numerical_aperture:
        description: The Numerical Aperture (NA) of this device expressed as a floating-point (real) number. NA can be calculated from the Angular Aperture (alpha) using the following formula, NA = n(sin alpha), and is a measure of how much of the incident light actually passes through this device. The larger the angular aperture, the more information this device can transmit. Expected range 0.02 - 1.5.
        range: float
        annotations:
          limi_tier: 3
        required: true
        notes:
          - AK has not added a min max constraint because this range could expand.
      acceptance_angle:
        description: The angle within which the light beam produced by a Light Source may be coupled with the bound modes of this Light Guide.
        range: float
        annotations:
          limi_tier: 3
      acceptance_angle_unit:
        description: Unit associated with the value of acceptance angle of the light guide
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit
      geometry:
        description: This field records the cross-section shape of this Light Guide.
        range: LiMiLightGuideGeometry
        annotations:
          limi_tier: 3
      material_name:
        description: This field records the chemical composition or the non-proprietary trade designation of the material used to construct this Light Guide.
        range: LiMiLightGuideMaterialName
        annotations:
          limi_tier: 3
        notes:
          - AK- Do we want to make a unified material class enum
          - DGG Possibly. Another option would be to use a “dynamic enum” using an ontology of materials. Let’s leave it like that for now.
      single_mode:
        description: This field records whether (True) this Light Guide is single-mode. If not (False), then the guide is assumed to be multi-modal.
        range: boolean
        annotations:
          limi_tier: 3
      waveguide_mode:
        description: This field records the transverse mode (or superposition of such modes) that are being imposed by this light guide onto the light wave traversing it. These modes generally follow different propagation constants.
        range: LiMiWaveguideMode
        annotations:
          limi_tier: 3
      diameter:
        description: This fields records the outer diameter of this Light Guide.
        range: float
        annotations:
          limi_tier: 3
      diameter_unit:
        description: Unit associated with the value representing the outer diameter of this Light Guide.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      wavelength_range:
        description:
          This element records the Range of Wavelengths this device is designed
          for, according to the Manufacturer. Multiple of this element may be
          used.
        range: LiMiWavelengthRange
        annotations:
          limi_tier: 3

  LiMiFreeBeam:
    description:
      A Free Beam coupling between the Light Source and the Microscope Stand
      consists of either a direct mount or an optical path that directs light
      across free space to the back of the Microscope Stand.
    is_a: LiMiLightSourceCoupling
    attributes:
      # Arnica has filled
      direct_mount:
        description: Whether light traveling via this Light Source Coupling device from the Light Source to the Microscope Stand travels via a direct mount attached to the Microscope Stand (True), or across an optical path through the air (False).
        range: boolean
        annotations:
          limi_tier: 2
        required: true
      mount_type:
        description: In case the DirectMount field is True, this field records the type of Direct Mount utilized to couple the Light Source to this Microscope Stand.
        annotations:
          limi_tier: 3
        required: true
        notes:
          - AK We should have an enum for this but for now the model does not have it.
      
  #################
  # Optics holder #
  #################

  LiMiOpticsHolder:
    description:
      A Holder for Filters, Dichroic, and other Optical Element that is
      associated with an Instrument.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      motorized:
        description:
          Whether this device is Motor (true) or Manually (false) operated.
        annotations:
          limi_tier: 3
        range: boolean
      response_time:
        description:
          The time it takes for this Optics Holder to switch from one position
          to another.
        annotations:
          limi_tier: 3
        range: float
      response_time_unit:
        description: Unit associated with the Response Time value.
        annotations:
          limi_tier: 3
        range: LiMiTimeUnit
        notes:
          -AK missing this default unit
      nr_of_slots:
        description: How many Slots this Optics Holder has.
        annotations:
          limi_tier: 2
        notes:
          - DGG Attributes are inconsistently named (some are "number_of_X",
            others, like this one, are "nr_of_X", while some others yet are
            "X_number").
        range: integer

  LiMiFilterCube:
    description:
      A removable cube-shaped unit that contains the filters and mirror used in
      epifluorescence microscopy to separate fluorescence excitation and
      emission light.
    is_a: LiMiOpticsHolder
    attributes:
      excitation_filter:
        description:
          An available Excitation Filter which is part of this Filter Cube.
        range: LiMiExcitationFilter
        inlined: false
      standard_dichroic:
        description:
          An available Dichroic Mirror which is part of this Filter Cube.
        range: LiMiDichroic
        inlined: false
        required: true
      emission_filter:
        description:
          An available Emission Filter which is part of this Filter Cube.
        range: LiMiEmissionFilter
        inlined: false
      optics_holder_position:
        description: The position of this Filter Cube in a Optics Holder.

  LiMiFilterCubeTurret:
    description: A circular holder for multiple Filter Cubes.
    is_a: LiMiOpticsHolder
    attributes:
      filter_cubes:
        description:
          Available filter cubes which are housed in this Optics Holder.
        notes:
          - DGG Do we really want a reference here? This means that each filter
            cube must first be listed directly under Instrument, and then
            referenced from here. It would be easier to list the filters
            directly under their housing turret.
        range: LiMiFilterCube
        multivalued: true
        inlined: false

  LiMiFilterWheel:
    description: A circular holder for multiple individual Filters or Dichroics.
    is_a: LiMiOpticsHolder

  LiMiExcitationFilterWheel:
    description: A circular holder for multiple individual Excitation Filters.
    is_a: LiMiFilterWheel
    attributes:
      excitation_filters:
        description:
          Available excitation filters which are part of this Optics Holder.
        range: LiMiExcitationFilter
        multivalued: true
        inlined: false

  LiMiDichroicFilterWheel:
    description: A circular holder for multiple individual Dichroics.
    is_a: LiMiFilterWheel
    attributes:
      standard_dichroics:
        description:
          Available Dichroic Mirrors which are part of this Optics Holder.
        range: LiMiDichroic
        multivalued: true
        inlined: false

  LiMiEmissionFilterWheel:
    description: A circular holder for multiple individual Emission Filters.
    is_a: LiMiFilterWheel
    attributes:
      emission_filters:
        description:
          Available emission filters which are part of this Optics Holder.
        range: LiMiEmissionFilter
        multivalued: true
        inlined: false

  LiMiFilterSlider:
    description: A linear holder for multiple individual Filters or Dichroics.
    is_a: LiMiOpticsHolder

  LiMiExcitationFilterSlider:
    description: A linear holder for multiple individual Excitation Filters.
    is_a: LiMiFilterSlider
    attributes:
      excitation_filters:
        description:
          Available excitation filters which are part of this Optics Holder.
        range: LiMiExcitationFilter
        multivalued: true
        inlined: false

  LiMiDichroicFilterSlider:
    description: A linear holder for multiple individual Dichroics.
    is_a: LiMiFilterSlider
    attributes:
      standard_dichroics:
        description:
          Available Dichroic Mirrors which are part of this Optics Holder.
        range: LiMiDichroic
        multivalued: true
        inlined: false

  LiMiEmissionFilterSlider:
    description: A linear holder for multiple individual Emission Filters.
    is_a: LiMiFilterSlider
    attributes:
      emission_filters:
        description:
          Available emission filters which are part of this Optics Holder.
        range: LiMiEmissionFilter
        multivalued: true
        inlined: false

  LiMiOpticsTurret:
    description: A circular holder for multiple optical elements.
    is_a: LiMiOpticsHolder
    attributes:
      optical_apertures:
        description:
          Available optical apertures which are housed in this Optics Holder.
        range: LiMiOpticalAperture
        multivalued: true
        inlined: false
      filters:
        description: Available filters which are housed in this Optics Holder.
        range: LiMiFilter
        multivalued: true
        inlined: false
      mirroring_devices:
        description:
          Available mirroring devices which are housed in this Optics Holder.
        range: LiMiMirroringDevice
        multivalued: true
        inlined: false
      lenses:
        description: Available lenses which are housed in this Optics Holder.
        range: LiMiLens
        multivalued: true
        inlined: false
      prisms:
        description: Available prisms which are housed in this Optics Holder.
        range: LiMiPrism
        multivalued: true
        inlined: false
      polarization_optics:
        description:
          Available polarization optics which are housed in this Optics Holder.
        range: LiMiPolarizationOptics
        multivalued: true
        inlined: false

  #####################
  # Mirroring devices #
  #####################

  LiMiMirroringDevice:
    description:
      A Mirror positioned in the Light Path for one or more Channels available
      on an Instrument.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    notes:
      - origdef This element describes a Mirror positioned in the Light Path for one or more Channels available for this Instrument. An Instrument may have several Mirrors of different types, such as Dichroic, Beamsplitter or Reflector. This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter Turret, Filter Wheel, or Filter Slider.
    attributes:
      #Arnica has filled
      optics_holder_position:
        description: This field records the position of this Mirroring Device in a Optics Holder of any kind, such as a Slider, Turret or Wheel.
        annotations:
          limi_tier: 2
      mirror_type:
        description: This field records the general category of this Mirror.
        range: LiMiMirrorType
        annotations:
          limi_tier: 3
        required: true
      geometry:
        description: This field records the optimal angle of incidence (AOI) for this Mirror. The AOI is the angle between the optical axis of the incident light and the axis normal to the surface of the Mirror. In specular reflection AOI is by definition equal to the Angle Of Reflection (AOR).
        range: LiMiMirrorGeometry
        annotations:
          limi_tier: 3
      diameter:
        description: This field describes the Diameter of this optical element.
        range: float
        annotations:
          limi_tier: 3
      diameter_unit:
        description: Unit associated with the value representing the diameter of a mirror
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        annotations:
          limi_tier: 3
      radius_of_curvature:
        description: The radius of curvature of this Mirror. A spherical lens or Mirror surface has a center of curvature located either along or decentered from the system local optical axis. The vertex of the lens surface is located on the local optical axis. The distance from the vertex to the center of curvature is the radius of curvature of the surface.
        range: float
        annotations:
          limi_tier: 3
      radius_of_curvature_unit:
        description: Unit associated with the value representing the radius of curvature of a mirror
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        annotations:
          limi_tier: 3
      angle_of_incidence:
        description: This field records the optimal angle of incidence (AOI) for this Mirror. The AOI is the angle between the optical axis of the incident light and the axis normal to the surface of the Mirror. In specular reflection AOI is by definition equal to the Angle Of Reflection (AOR).
        range: float
        annotations:
          limi_tier: 3
      angle_of_incidence_unit:
        description: Unit associated with the value representing the optimal angle of incidence for this mirror
        range: LiMiAngleUnit
        ifabsent: LiMiLengthUnit(deg)
        annotations:
          limi_tier: 3
      substrate_type:
        description: This field records the type of Substrate that is used for this Mirror. It is typically a ground and polished piece of optical glass.
        annotations:
          limi_tier: 3
      substrate_material:
        description: This field records the chemical composition or the designation of the substrate of this Mirroring Device. The substrate is typically composed of a glass material with low autofluorescence, such as UV-grade fused silica or Borofloat.
        range: LiMiOpticalMaterial
        annotations:
          limi_tier: 3
      glass_code:
        description: If available, this field records the international Glass Code of the material that constitutes this Mirror. The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass Code of 517642.
        annotations:
          limi_tier: 3

  LiMiDichroic:
    description:
      A Mirror that spectrally separate light by transmitting and reflecting 
      light as a function of wavelength. In the context of fluorescence
      microscopy, they are typically used to reflect the excitation light, but
      transmit the emitted fluorescence.
    comments:
      - Dichroic mirrors are also often referred to as Dichroic Beamsplitters,
        Dichromatic Mirrors or simply Dichroics.
    is_a: LiMiMirroringDevice
    attributes:
      # Arnica has filled
      type:
        description: This field captures the Type of Dichroic used in this case.
        range: LiMiFilterType
        required: true
      coating_method:
        description: This field records the type of Coating used in this case. An optical coating is one or more thin layers of material deposited on an optical component such as a Lens, Filter or Mirror, which alters the way in which the optic reflects and transmits light.
        range: LiMiFilterCoatingMethod
        required: true
      light_path_location:
        description: This field records the location of this component in the Microscope Light Path. The most common positions are, Infinity Space, Camera Port or Illumination Port.
        range: LiMiFilterLightPathLocation
        required: true
      technology:
        description: This field records the filtering Technology utilized for this optical element. The main types of technologies used in fluorescence analysis are Absorption (aka colored) glass, Polymer or Thin-film coating.
        range: LiMiFilterTechnology
        annotations:
          limi_tier: 2
      attenuation_method:
        description: This field records the means by which this optical element achieves out-of-band transmission attenuation.
        range: LiMiFilterAttenuationMethod
        annotations:
          limi_tier: 2
        required: true
      attenuation_coefficient:
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient) is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed) by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance (0≤T≤1).
        range: float
        annotations:
          limi_tier: 3
      thickness:
        description: This field describes the Thickness of this optical element.
        range: float
        annotations:
          limi_tier: 3
      thickness_unit:
        description: Unit associated with the value representing thickness of an optical element
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit
      polarization:
        description: This field records the polarization effect of this optical element. Any thin-film interference coating that is used at non-normal angles-of-incidence will cause some amount of polarization, the precise effect varying greatly with wavelength and with the particular coating design.
        range: LiMiFilterPolarization
        notes:
          - Should we make a LiMiPolarization enum instead to cover also polarized illumination?

  LiMiStandardDichroic:
    description:
      A Dichroic positioned in the standard Light Path for one or more Channels
      available for an Instrument.
    is_a: LiMiDichroic

  LiMiAdditionalDichroic:
    description:
      A generic Additional Dichroic positioned in the Light Path for one or more
      Channel available for an Instrument.
    is_a: LiMiDichroic

  LiMiReflectanceRange:
    description:
      The Range (also known as the Band) of Wavelengths that are reflected by a
      Dichroic Mirror.
    is_a: LiMiObject
    attributes:
      wavelength:
        description:
          The key Wavelength that characterizes this Reflectance Range (also
          known as Reflection band). In most cases, Wavelength refers to the
          CutOn Wavelength (i.e., below which there is less than 50%
          transmittance) but it might also refer to the CutOff wavelength (i.e.,
          above which there is less than 50% transmittance) or the Center
          Wavelength of the Reflectance Band.
        range: float
      wavelength_unit:
        description: Unit associated with the Wavelength value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      reflectance:
        description:
          The maximum amount of light this optical component is capable of
          reflecting in this Wavelength Range, at the peak Wavelength.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      FWHM_bandwidth:
        description:
          The width of this Reflectance Range (also known as Reflection band).
          Specifically, the Full Width at Half Maximum (FWHM) represents the
          bandwidth of the Wavelength spectrum curve measured between those
          points whose transmission amplitude is 50% of the maximum.
        range: float
        minimum_value: 0.0
      FWHM_bandwidth_unit:
        description: Unit associated with the FWHM Bandwidth value.
        range: LiMiLengthUnit
      notes:
        - AK How do we declare this class under specific optical elements?
        - Would it not be future-proof to not restrict the definition of these ranges to any one optical element?


  LiMiBeamsplitter:
    description:
      A Mirror that reflects part of the light, regardless of Wavelength.
    is_a: LiMiMirroringDevice
    attributes:
      #Arnica has filled
      transmittance:
        description: This field records the maximum amount of light a beamsplitter is capable of transmitting at the peak wavelength. It is represented as a fractional value from 0.0 to 1.0.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        annotations:
          limi-tier: 2
        required: true
      transmission_angle:
        description: The angle at which light is transmitted by this Beamsplitter.
        range: float
        annotations:
          limi_tier: 3
      transmission_angle_unit:
        description: Unit associated with the value representing the transmission angle of a beamsplitter
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3
      reflectance:
        description: The field records the maximum amount of light a beamsplitter is capable of reflecting at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        annotations:
          limi-tier: 2
        required: true

  LiMiReflectingMirror:
    description: A total reflection Mirror.
    is_a: LiMiMirroringDevice
    attributes:
      # Arnica has filled
      reflectance:
        description: The field records the maximum amount of light this Mirror is capable of reflecting at the peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      annotations:
        limi_tier: 2
      required: true

  #####################
  # Optical apertures #
  #####################

  LiMiOpticalAperture:
    description:
      Any mechanical, non optical device that is placed in the Light Path and
      spatially modifies the light beam.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      #Arnica has filled
      optics_holder_position:
        description: This field records the position of this Optical Aperture in a Optics Turret.
        annotations:
          limi_tier: 2
      outer_diameter:
        description: This field captures the physical outer diameter of a component
        range: float
        annotations:
          limi_tier: 3
      outer_diameter_unit:
        description: Unit associated with the value representing the outer diameter of a component
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3

  LiMiDarkFieldStop:
    description:
      A central circular stop (i.e., opaque disk) usually used in dark-field
      microscopy and placed in the front focal plane of a Condenser to occlude
      all the direct light which would fall within the aperture of the
      objective.
    is_a: LiMiOpticalAperture
    attributes:
      center_stop_diameter:
        description:
          The physical diameter of the central disk of this Dark Field Stop.
        range: float
      center_stop_diameter_unit:
        description: Unit associated with the Center Stop Diameter value.
        range: LiMiLengthUnit

  LiMiPhaseRing:
    description:
      An annular (ring-like) slit used to produce contrast modulation following
      Zernike, in which the image contrast of a phase object is enhanced by
      altering the phase and amplitude of the direct light with respect to those
      of the diffracted light. This illuminating aperture Diaphragm is placed in
      the front focal plane of the Condenser and acts in conjunction with an
      appropriate phase plate, usually in the form of an annulus, placed in the
      back focal plane of the objective (or in a succeeding plane conjugate with
      this).
    comments:
      - Also called a Phase Annulus.
    is_a: LiMiOpticalAperture
    attributes:
      # Arnica has filled
      phasenumber:
        description: This field captures the Phase Number used to identify the size of the annular slit of this Phase Ring. The Phase Number must match the Phase Plate found within a Phase-contrast capable Objective lens.
        range: LiMiPhaseRingNumber
        required: true
      center_stop_diameter:
        description: This filed records the physical diameter of the center-stop (i.e. opaque disk) of this Phase Ring.
        range: float
        annotations:
          limi_tier: 3
      center_stop_diameter_unit:
        description: Unit associated with the value representing the center stop diameter of a phase ring
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      slit_width:
        description: This field records the physical width of the annular slit of this Phase Ring.
        range: float
        annotations:
          limi_tier: 3
      slit_width_unit:
        description: Unit associated with the width of the annular slit of this Phase Ring.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3

  LiMiHoffmanPlate:
    description:
      A Plate that contains an off-axis slit aperture positioned in the front
      focal plane of the Condenser. It is used alongside a Hoffman contrast
      modulator (i.e., optical amplitude spatial filter) present in the back
      focal plane of the objective or in a succeeding conjugate plane to produce
      contrast modulation as described by Hoffman (i.e., Hoffman Contrast
      Modulation, HMC). Hoffman modulation contrast is not hampered by the use
      of birefringent materials (such as plastic Petri dishes) in the optical
      pathway, so the technique is more useful for examining specimens in
      containers constructed with polymeric materials.
    is_a: LiMiOpticalAperture
    attributes:
      design:
        description: The design of the slit of this Hoffman Plate.
        range: LiMiHoffmanPlateSlitDesign

  LiMiIrisDiaphragm:
    description:
      A Diaphragm, positioned transversally to the optical axis bounded by
      multiple leaves, usually metal, arranged so as to provide an opening of
      variable size, which is adjustable by means of a mechanical control.
    is_a: LiMiOpticalAperture
    attributes:
      #Arnica has filled
      maximum_aperture_diameter:
        description: This field records the Maximum physical Diameter of the Aperture of this Iris Diaphragm.
        range: float
        annotations:
          limi_tier: 2
      maximum_aperture_diameter_unit:
        description: Unit associated with the maximum physical diameter of the iris diaphragm
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 2
      shape:
        description: This field captures the Shape of the aperture of this Iris Diaphragm.
        range: LiMiIrisShape
        annotations:
          limi_tier: 3

  LiMiVarelRing:
    description:
      A stop (i.e., opaque structure) shaped like a ring sector, which is used
      on the illumination side, to permit unilateral inclined illumination. It
      was developed to work in combination with Phase Objectives to yield
      contrast even when light passes through birefringent materials, such as
      plastic Petri dishes.
    is_a: LiMiOpticalAperture

  LiMiShutter:
    description:
      A device that opens and closes, and that may be mechanically or
      electro-mechanically controlled. Shutters are typically used to control
      the Light that reaches the sample (i.e., to limit phototoxicity and
      photobleaching especially in case of live specimens),  or the Detector at
      any one time. They can also be used for Excitation or Emission Wavelength
      selection.
    is_a: LiMiOpticalAperture
    attributes:
      # Arnica has filled
      response_time:
        description: This field (also known as Speed) records the time it takes for this Shutter to completely open and close, according to the Manufacturer.
        range: float
      response_time_unit:
        description: Unit associated with the value representing the response time of the shutter to completely open and close
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit (s)
        notes:
          - AK made up this default unit
      function:
        description: This field records whether this Shutter is used for the control of illumination (especially relevant for live imaging), the selection of Excitation or Emission waveLengths or the control of the Light that reaches the Detector.
        range: LiMiShutterFunction
        annotations:
          limi_tier: 2
      operation_frequency:
        description: This field records the Frequency of Operation of this Shutter, according to the Manufacturers.
        range: float
        annotations:
          limi_tier: 2
      operation_frequency_unit:
        description: Unit associated with the value representing the operation frequency of the shutter
        range: LiMiFrequencyUnit
        ifabsent: LiMiFrequencyUnit (Hz)
        notes:
        - AK made up this default unit
        annotations:
          limi_tier: 2
      motorized:
        description: This field describes whether this device is Motor (True) or Manually (False) operated.
        range: boolean
        annotations:
          limi_tier: 2
      maximum_aperture_diameter:
        description: This field records the maximum physical diameter of the aperture of a shutter
        range: float
        annotations:
          limi_tier: 2
      maximum_aperture_diameter_unit:
        description: Unit associated with the value representing the maximum physical diameter of the shutter aperture
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 2
      multimode:
        description: This field records whether (True) multiple operation modes are available for this Shutter or not (False). Typical operation modes are, Fast, Soft and Neutral Density. The Fast mode provides the quickest open and close action sequence for which the shutter is capable. The Soft mode gradually opens and closes the shutter to reduce vibration. Control of light intensity without affecting wavelength is accommodated by a Neutral Density shutter mode (for more details see https://www.microscopyu.com/applications/live-cell-imaging/the-automatic-microscope).
        range: boolean
        annotations:
          limi_tier: 2

  ##########
  # Lenses #
  ##########

  LiMiLens:
    description:
      An additional lense positioned in the Light Path for one or more Channels
      available for an Instrument. A Lens is a component of glass or transparent
      plastic material, usually circular, with two primary surfaces that are
      ground and polished in a specific manner designed to produce either a
      convergence or divergence of light passing through the material. An
      Instrument may have several Lenses with different functions, such as a
      Magnification Changer (also known as Optovar), a Coupling Lens connecting
      the Light Source with the Microscope Stand, a Relay Lens positioned at the
      Detector mount, or additional Lenses placed in the Light Path for various
      purposes. This element can be associated with an optional Optics Turret.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      # Arnica has filled
      magnification:
        description: This field records the nominal Magnification provided by this Lens as specified by the Manufacturer.
        range: float
        required: true
      lens_na:
        description: This field captures the Numerical Aperture (NA) of this Lens expressed as a floating-point (real) number. NA is a number that was defined initially by Abbe to characterize Objectives and Condensers. NA can be calculated by the expression n sin alpha, where n is the Refractive Index of the medium between the Lens and the Sample, and alpha is half the Angular Aperture of the Lens. NA is a measure of how much of the illumination that leaves the specimen actually passes through the Lens. The larger the NA, the more information the lens can transmit. Expected range 0.02 - 1.5.
        range: float
      infinity:
        description: This field records whether (True) or not (False) this Lens is infinity corrected. An Infinity-corrected Lens is fixed for an infinite sample to primary image distance. It needs to be used with a Tube Lens of appropriate focal length to obtain the specified magnification.
        range: boolean
        annotations:
          limi_tier: 2
      composite:
        description: This field records whether this Lens is Composite (True) or Simple (False).
        range: boolean
        annotations:
          limi_tier: 3
        required: true
      shape:
        description: This field records the shape of the profile (e.g., concave vs. convex) of this Lens. Please note that this attribute is often used to classify Lenses into categories.
        range: LiMiLensShape
        annotations:
          limi_tier: 3
        required: true
        notes:
          - AK this enum was originally called LensShape
      geometry:
        description: This field records the geometrical shape of this Lens' surface(s).
        range: LiMiLensGeometry
        annotations:
          limi_tier: 3
      coating:
        description: An optical Coating consists of one or more thin layers of material deposited on an optical component such as a Lens or Mirror, which alters the way in which the optic reflects and transmits light. This field records the optical Coating used for this Lens.
        annotations:
          limi_tier: 3
        notes:
          - AK- for later model revision-- add an enum with option other
      attenuation_coefficient:
        description: This field records the Attenuation Coefficient (AC) of this optical element. The AC (aka blocking coefficient) is a material property that characterizes the degree to which light is being blocked (i.e., scattered or absorbed) by it. AC is used as a measure of the out-of-band blocking of an optical Lens, Filter, Dichroic mirror over an extended range of the spectrum. AC is often reported in units of optical density (OD), whereas OD= -log10(T), and T=Transmittance (0≤T≤1).
        range: float
        annotations:
          limi_tier: 3
      working_distance:
        description: This field reports the Working Distance of this Lens under normal operating conditions. The Working Distance is the distance (in air, or in the specified immersion liquid) between the front of an Objective and the surface of the cover glass or of the specimen if uncovered.
        range: float
        annotations:
          limi_tier: 2
      working_distance_unit:
        description: Unit associated with the value representing the working distance of a lens
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 2
      image_distance:
        description: This field records the distance in air between the rear principal plane of this Lens and the primary Image plane.
        range: float
        annotations:
          limi_tier: 3
      image_distance_unit:
        description: Unit associated with the value representing the image distance of a lens
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      front_focal_length:
        description: This field records the distance (f) measured along the optical axis from the front principal plane of this Lens to the front focal plane (F).
        range: float
        annotations:
          limi_tier: 3
      front_focal_length_unit:
        description: Unit associated with the value representing the front focal length of a lens
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      back_focal_length:
        description: This field records the distance (f) measured along the optical axis from the front principal plane of this Lens to the front focal plane (F).
        range: float
        annotations:
          limi_tier: 3
      back_focal_length_unit:
        description: Unit associated with the value representing the back focal length of a lens
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      radius_of_curvature:
        description: This field records the Radius of Curvature of this Lens. A spherical Lens or Mirror surface has a center of curvature located either along or decentered from the system local optical axis. The vertex of the lens surface is located on the local optical axis. The distance from the vertex to the center of curvature is the Radius of Curvature of the surface.
        range: float
        annotations:
          limi_tier: 3
      radius_of_curvature_unit:
        description: Unit associated with the value representing the radius of curvature of a lens
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        notes:
        - AK made up this default unit
        annotations:
          limi_tier: 3
      material_name:
        description: This field records the chemical composition or designation of the Material this Lens is made of.
        range: LiMiOpticalMaterial
        annotations:
          limi_tier: 3
        notes:
          - AK cahanged the name of this enum
      glass_code:
        description: If available, this field records the international Glass Code of the material that constitutes this Lens. The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass Code of 517642.
        annotations:
          limi_tier: 3
      refractive_index:
        description: This field records the Refractive Index of the material this Lens is made of, as specified by the Manufacturer. The Refractive Index is the ratio of the speed of light (more precisely, the phase velocity) in a vacuum versus that in a given medium.
        range: float
        annotations:
           limi_tier: 2
      abbe_number:
        description: This field records the Abbe number of this Lens. The Abbe Number is a measure of the material's dispersion (variation of Refractive Index versus Wavelength), with high values indicating low dispersion.
        range: float
        annotations:
          limi_tier: 3
      density:
        description: This field records the Density of the material this Lens is made of.
        range: float
        annotations:
          limi_tier: 3
      density_unit:
        description: Unit associated with a value representing a material's density
        range: LiMiDensityUnit
        ifabsent: LiMiDensityUnit(kg/m3)
        annotations:
          limi_tier: 3

  LiMiMagnificationChanger:
    description:
      A Magnification Changer provides additional magnification that can be
      beneficial when a desired field of view is required for the imaging
      sensor. Magnification Changers are placed before the Tube Lens within the
      infinity space of the optical system. Typical magnification increments are
      1.25x, 1.6x, and 2x.
    comments:
      - Also known as Optovar because one of the first magnification changing
        devices was developed by Zeiss and given this proprietary name.
    is_a: LiMiLens

  LiMiGenericLens:
    description:
      Any additional generic Lens positioned in the Light Path for a given
      Channel.
    notes:
      - DGG Should not be needed. If the exact type of lens is not known, the
        parent LiMiLens can be used instead.
    is_a: LiMiLens

  LiMiBeamExpanderLens:
    description:
      A Lens designed to work in combination with other optical components to
      form a Beam Expander device. As such, its role is to increase the diameter
      of a collimated input beam to a larger collimated output beam.
    is_a: LiMiLens

  LiMiBeamCollimatorLens:
    description:
      A Lens designed to work in combination with other optical components to
      form a Beam Collimator device. As such, its role is to transform a
      strongly diverging light beam into a collimated beam, i.e., a beam where
      light propagates mainly only in one direction, and the beam divergence is
      weak.
    is_a: LiMiLens

  LiMiCondenserLens:
    description:
      A Condenser Lens renders a divergent beam from a point source into a
      parallel or converging beam to illuminate an object. It acts to gather
      light from the Light Source and concentrate it into a cone of light that
      illuminates the specimen. The aperture and angle of the light cone must be
      adjusted (via the size of the diaphragm) for each different objective Lens
      with different numerical apertures. Condenser Lenses are typically housed
      within a specific component of the Microscope called the Condenser.
    is_a: LiMiLens

  LiMiCouplingLens:
    description:
      A Lens positioned at the mount connecting the Light Source Coupling device
      and the Microscope Stand.
    is_a: LiMiLens

  LiMiRelayLens:
    description:
      A Relay Lens is often used in combination with other Lenses for
      transferring an Image into a different optical plane. A typical example of
      Relay Lens is the Lens positioned at the mount connecting a Detector with
      the Microscope Stand.
    is_a: LiMiLens

  LiMiTubeLens:
    description:
      A Tube Lens is an intermediate Lens, located within the Microscope's
      Illumination Tube, which is designed to operate as an essential component
      of infinity-corrected Objectives, and which should be regarded as an
      integral part of the Objective lens system when magnification and
      correction are considered. In some Microscope Tubes, Lenses might be
      located within the Microscope Stand and might not be immediately
      accessible.
    is_a: LiMiLens

  #######################
  # Polarization optics #
  #######################

  LiMiPolarizationOptics:
    description:
      A Polarization device positioned in the Light Path for an Instrument. A
      Polarization device is an optical filter rotatable through 360° that lets
      light waves of a specific polarization pass through while blocking light
      waves of other polarizations. This element can be associated with an
      optional Optics Turret.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      # Arnica has filled
      function:
        description: This field records whether this Polarization Optics is used to generate (Polarizer) or to analyze (Analyzer) polarized light.
        range: LiMiPolarizationOpticsFunction
        required: true
      cross_polarizer:
        description: This field records whether (True) or not (False) this Polarization Optics is a combination of an Analyzer and a Polarizer positioned orthogonal to each other.
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      dic:
        description: This field records whether (True) or not (False) this Polarization Optics is used for Differential Interference Contrast (DIC) microscopy.
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      beam_splitter:
        description: This field records whether (True) or not (False) this is PolarizationOptics has a beam splitter function.
        range: boolean
        annotations:
          limi_tier: 2
      faraday_isolator:
        description: This field records whether (True) or not (False) this PolarizationOptics is a Faraday Isolator. A Faraday Isolator is an optical component which allows light to pass through in only ONE direction and therefore protects laser systems against back reflection. It uses the Faraday magneto-optical effect to turn the polarization of light between various polarizers.
        range: boolean
        annotations:
          limi_tier: 2
      construction:
        description: This field records the modality with which this PolarizationOptics is constructed.
        range: LiMiPolarizationOpticsConstruction
        annotations:
          limi_tier: 2
      retardation:
        description: This field records the Phase shift that exists between the polarized light component projected along the fast axis and the part projected along the slow axis.
        range: LiMiPolarizationOpticsRetardation
        annotations:
          limi_tier: 2
      fabrication:
        description: This field records the way in with which this PolarizationOptics is fabricated.
        range: LiMiPolarizationOpticsFabrication
        annotations:
          limi_tier: 3
      material_name:
        description: This field records the chemical composition or designation of the Material this Polarization Optics is made of.
        range: LiMiOpticalMaterial
        annotations:
          limi_tier: 3
      glass_code:
        description: If available, this field records the international Glass Code of the material that constitutes this Lens. The Glass Code designation is based on U.S. military standard MIL-G-174, and it consists of a six-digit number specifying the glass according to its Refractive Index nd at the Fraunhofer d- (or D3-) line, and its Abbe Number Vd also taken at that line. The resulting Glass Code is the value of nd-1 rounded to three digits, followed by Vd rounded to three digits, with all decimal points ignored. For example, BK7 has nd = 1.5168 and Vd = 64.17, giving a six-digit Glass Code of 517642.
        annotations:
          limi_tier: 3
      wavelength_range:
        description: This element records a range of Wavelengths this device is designed for, according to the Manufacturer. Multiple of this element may be used.
        range: LiMiWavelengthRange
        annotations:
          limi_tier: 3

  ##########
  # Prisms #
  ##########

  LiMiPrism:
    description:
      A Prism positioned in the Light Path for one or more Channels available
      for this Instrument. A Prism is a block of glass or other transparent
      material with at least two intersecting flat, polished surfaces, used to
      disperse light or deviate it through an angle. A Prism can be viewed as an
      ensemble of different rigidly mounted Mirrors, with each face having a
      permanent orientation with respect to others. A Prism can be employed to
      deflect or deviate a light beam, rotate or invert an image, separate
      polarization states, or disperse light into its component Wavelengths. An
      Instrument may have several Prisms with different functionality such as
      Polarizing, Reflecting, or Refracting (or Dispersing). Polarizing Prisms
      are birefringent crystals that divide incident non-polarized light into
      separate components polarized orthogonally to each other. Reflecting
      Prisms are useful for redirecting light beams by total internal
      reflection. Refracting (or Dispersing) Prisms can be employed to bend and
      separate light into its component colors. This element can be associated
      with an optional Optics Turret.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      # Arnica has filled
      dic:
        description: This field records whether this Prism is used for Differential Interference Contrast (DIC) microscopy and, if so, what DIC-compatible type it is (i.e., deSenarmont, Nomarski or Wollaston).
        range: LiMiDICPrismType
      function:
        description: This field records the function of this Prism. Beam-shaping (i.e., Anamorphic) Prism pairs are used for reshaping the profile of a laser beam. For example, the elliptical beam from a laser diode can be transformed into a beam with circular cross-section, by magnifying the elliptical beam in one dimension. They can also be used to convert a circular beam into an elliptical beam. Dispersing prisms can be employed to bend and separate light into its component wavelengths. Polarizing prisms (i.e., Glan–Thompson, Nomarski, Wollaston) are birefringent crystals, which divide incident non-polarized light into separate components polarized orthogonally to each other. Reflecting prisms are useful for redirecting (i.e., flip, invert, rotate, etc.) light beams by total internal reflection or for dividing them into two or more separate beams (i.e., beam-splitting) one.
        range: LiMiPrismFunction
        required: true
        annotations:
          limi_tier: 2
      condenser:
        description: This field records whether this Prism is within the Condenser (True) or the Objective (False).
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      oil_objective:
        description: This field records whether this Prism is designed to work with oil Objectives (True) or not (False).
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      compound:
        description: This field records whether this Prism is a Compound Prism (i.e., a set of multiple triangular prism elements placed in contact, and often cemented together to form a solid assembly; True) or a Simple Prism (False).
        range: boolean
        annotations:
          limi_tier: 2
      refractive_index:
        description: This field records the Refractive Index of the material this Prism is made of, as specified by the Manufacturer.
        range: float
        annotations:
          limi_tier: 3
      reflectance:
        description: This field records the maximum amount of light this Prism is capable of transmitting at peak Wavelength. It is represented as a fractional value from 0.0 to 1.0.
        range: float
        required: true
        annotations:
          limi_tier: 3
      angle_of_incidence:
        description: This field records the Angle Of Incidence (AOI) is the angle between a beam of light incident on the Prism surface and the line perpendicular to the surface at the point of incidence, called the normal.
        range: float
        annotations:
          limi_tier: 3
      angle_of_incidence_unit:
        description: Unit associated with the value representing an angle of incidence
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3
      deviation_angle:
        description: This field records the Deviation Angle of this Prism. A beam passing through an object like a prism is deflected twice- once entering, and again when exiting. The sum of these two deflections is called the deviation angle and is measured with respect to the incident ray.
        range: float
        annotations:
          limi_tier: 3
      deviation_angle_unit:
        description: Unit associated with the value representing a deviation angle
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3
      prism_angle:
        description: This field records the Angle between two surfaces of this Prism.
        range: float
        annotations:
          limi_tier: 3
      prism_angle_unit:
        description: Unit associated with the value representing a prism angle
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3
      design:
        description: This field records the shape of the Prism with specific reference to the angles defined by its faces.
        range: LiMiPrismDesign
        annotations:
          limi_tier: 3
      abbe_number:
        description: This field records the Abbe number of this Prism. The Abbe Number is a measure of the material's dispersion (variation of Refractive Index versus Wavelength), with high values indicating low dispersion.
        range: float
        annotations:
          limi_tier: 3
      material_name:
        description: This field records the chemical composition or designation of the Material this Prism is made of.
        range: LiMiOpticalMaterial
        annotations:
          limi_tier: 3
      glass_code:
        description: This field records the Density of the material this Prism is made of.
        annotations:
          limi_tier: 3
      density:
        description: This field records the Density of the material this Prism is made of.
        range: float
        annotations:
          limi_tier: 3
      density_unit:
        description: Unit associated with the value representing a material's density
        range: LiMiDensityUnit
        ifabsent: LiMiDensityUnit(kg/m3)
        annotations:
          limi_tier: 3
      wavelength_range:
        description:
          This element records the Range of Wavelengths this device is designed
          for, according to the Manufacturer. Multiple of this element may be
          used.
        range: LiMiWavelengthRange
        annotations:
          limi_tier: 3


  ################
  # Stage insert #
  ################

  LiMiStageInsert:
    description: An optional Stage Insert mounted on the Stage.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      # Arnica has filled
      sample_holder_type:
        description: This field describes the type of Specimen Holder this Stage Insert is designed to hold.
        range: LiMiSampleHolderType
        required: true
        annotations:
          limi_tier: 2
      temperature_controlled:
        description: This field records whether this Stage Insert is Temperature Controlled (True), or not (False).
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      number_of_slots:
        description: This field describes the number of Specimen Holder slots on this Stage Insert.
        range: integer
        annotations:
          limi_tier: 2

  ##############################
  # Sample positioning devices #
  ##############################

  LiMiSamplePositioningDevice:
    description:
      A Sample-Optics Positioning device available for an Instrument. An
      Instrument may have more than one of these devices of different types. For
      example, a typical setup might include a Mechanical Stage, a Stage Insert,
      a Turret Objective Focusing, and a Piezoelectric Objective Focusing
      device.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      # Arnica has filled
      encoded:
        description: This field describes whether a Sample Positioning Device is equipped with a system (i.e., encoder) to monitor movement and provide automatic positional feedback for high-precision operations, and it specifies the type of encoders it has.
        range: LiMiSamplePositioningEncoder
        required: true
      motorized:
        description: This field describes whether (True) or not (False) a Sample Positioning Device is fitted with a Motorized component (i.e., ball-screw drives or rack mechanisms, sometimes equipped with precision calibration) to primarily assist in the translational movement of the sample in the X and Y or Z directions. A Motorized Stage is also often referred to as a Scanning Stage.
        range: boolean
        required: true
      z_max_velocity:
        description: This field describes the maximum Z-axis Velocity at which a Sample Positioning Device is capable of moving.
        range: float
      z_max_valocity_unit:
        description: Unit associated with a value describing the Z-max velocity of the sample positioning device
        range: LiMiVelocityUnit
        ifabsent: LiMiVelocityUnit(nm/s)
      z_repeatability:
        description: This field captures the expected Accuracy with which a Sample Positioning Device is capable of returning to a previously visited Z-axis Position, as specified by the Manufacturer. This metric is important for example for Tiling.
        range: float
        required: true
      z_repeatability_unit:
        description: Unit associated with a value representing repeatability of the sample positioning device in the Z- direction
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      z_travel_range:
        description: This field describes the total range in the Z-axis that a Sample Positioning Device can travel.
        range: float
      z_travel_range_unit:
        description: Unit associated with a value representing the travel range of a sample positioning device in the Z- direction
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(µm)
      movement_axes:
        description: This field describes the axes or combination of axes along which a Sample Positioning Device is capable of moving.
        range: LiMiSpatialAxes
        annotations:
          limi_tier: 2
        required: true
      built_in:
        description: This field indicates whether a Sample Positioning Device is built into the Microscope Stand (True) or it is removable and interchangeable (False).
        range: boolean
        annotations:
          limi_tier: 2
          required: true
      z_reproducibility:
        description: This field captures the expected precision with which a Sample Positioning Device is capable of maintaining a given Z-axis Position over time as specified by the Manufacturer. This metric is generally referred to as Reproducibility and it might also be referred to as Focal Drift. This metric is particularly relevant for Stereology systems and for the calibration of Sample Positioning devices.
        range: float
        annotations:
          limi_tier: 2
      z_reproducibility_unit:
        description: Unit associated with a value representing the z reproducibility or focal drift of a sample positioning system
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(µm)
        annotations:
          limi_tier: 2
        notes:
          - AK made up this default unit
      z_settling_time:
        description: This field describes the expected time it takes for a Sample Positioning Device to stabilize at the target Z-axis position, as specified by the Manufacturer.
        range: float
        annotations:
          limi_tier: 2
      z_settling_time_unit:
        description: Unit associated with the value representing the time taken by a sample positioning system to stabilize at a target Z- position
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit(ms)
        annotations:
          limi_tier: 2
      z_resolution:
        description: This field describes the Z-axis motion Resolution of a Sample Positioning Device as specified by the Manufacturer.
        range: float
        annotations:
          limi_tier: 2
      z_resolution_unit:
        description: Unit associated with a value representing the Z-resolution of the motion of a sample positioning device
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
        annotations:
          limi_tier: 2
      z_position_linearity_error:
        description: This field describes the Z-axis positioning error (typically expressed in % error) associated with a Sample Positioning Device as specified by the Manufacturer.
        range: float
        annotations:
          limi_tier: 2
      type:
        description: This field describes the general category of a Sample Positioning Device.
        range: LiMiSamplePositioningDevice
        annotations:
          limi_tier: 3
      rotation_angle:
        description: The angle by which a Sample Positioning Device is capable of rotating.
        range: float
        annotations:
          limi_tier: 3
      rotation_angle_unit:
        description: Unit associated with the value representing the rotation angle of a sample positioning device
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3

  LiMiFocusingDevice:
    description:
      A Focusing mechanism is used to obtain maximum sharpness in an Image by
      changing the distance between a Sample and the optical system forming the
      Image. In most cases, a Z-axis Focusing mechanism moves the Objective
      along the optical axis.
    is_a: LiMiSamplePositioningDevice

  LiMiTurretObjectiveFocusingDevice:
    description:
      A Focusing Device associated with a rotating Objective Turret associated
      with this Instrument. This type of device is often operated using a rack
      and pinion mechanism.
    is_a: LiMiFocusingDevice

  LiMiIndividualObjectiveFocusingDevice:
    description:
      An optional objective nano-Focusing Device associated with this
      Instrument. These devices might be driven using piezoelectric mechanisms
      or linear motor actuators associated with crossed roller guideways. They
      typically achieve higher precision, accuracy, and speed than traditional
      Focusing Devices.
    is_a: LiMiFocusingDevice
    attributes:
      piezo_electric:
        description:
          Whether this device is piezoelectric driven (true) or not (false).
        range: boolean

  LiMiZDrive:
    description:
      This element describes a Focusing Device designed to electronically
      control a moving a mechanical part of the Microscope such as the Stage, or
      the Microscope Stand itself (e.g. most dissecting Microscopes). An example
      of such devices is the MFC-2000 Z-Axis Drive and Controller.
    see_also:
      - http://www.asiimaging.com/controllers/mfc-2000-z-axis-drive-and-controller/#tab-id-4
    is_a: LiMiFocusingDevice

  LiMiStage:
    description:
      A platform positioned at right angle to the optical axis of this
      Microscope, which is designed to either directly hold a Specimen Holder
      containing a Sample to be observed, or a Stage Insert, which itself holds
      the Sample Holder. In many cases, this device is capable of mechanical
      movements (as in a Mechanical Stage) to allow easy positioning and
      rotation of the Sample in the X-, Y-, and Z-axes.
    is_a: LiMiSamplePositioningDevice
    attributes:
      # Arnica has filled
      xy_max_velocity:
        description: This field describes the maximum XY-axis Velocity at which a Stage is capable of moving.
        range: float
      xy_max_velocity_unit:
        description: Unit associated with the maximum XY-axis velocity of a stage
        range: LiMiVelocityUnit
        ifabsent: LiMiVelocityUnit(nm/s)
      xy_repeatability:
        description: This field captures the expected accuracy with which a Stage is capable of returning to a previously visited XY-plane Position, as specified by the Manufacturer. This metric is important for example for Tiling.
        range: float
        required: true
      xy_repeatability_unit:
        description: Unit associated with a value representing repeatability of positioning of a stage in the XY- plane
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      x_travel_range:
        description: This field describes the total range in the X-axis that a stage can travel.
        range: float
        required: true
        annotations:
          limi_tier: 2
      x_travel_range_unit:
        description: Unit associated with a value representing the travel range of a stage in the X- direction
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(µm)
        required: true
        annotations:
          limi_tier: 2
      y_travel_range:
        description: This field describes the total range in the Y-axis that a Stage can travel.
        range: float
        required: true
        annotations:
          limi_tier: 2
      y_travel_range_unit:
        description: Unit associated with a value representing the travel range of a stage in the Y- direction
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(µm)
        required: true
        annotations:
          limi_tier: 2
      xy_reproducibility:
        description: This field captures the expected Precision with which a Stage is capable of maintaining a given XY-plane Position over time during as specified by the Manufacturer. This metric is generally referred to as Reproducibility and it might also be referred to as Lateral Drift. This metric is particularly relevant for Stereology systems and for the calibration of Sample Positioning devices.
        range: float
        annotations:
          limi_tier: 2
      xy_reproducibility_unit:
        description: Unit associated with a value representing the XY reproducibility of a stage
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(µm)
        annotations:
          limi_tier: 2
        xy_settling_time:
          description: This field describes the expected time it takes for a Stage to stabilize at the target XY-plane position, as specified by the Manufacturer.
          range: float
          annotations:
            limi_tier: 2
        xy_settling_time_unit:
          description: Unit associated with the value representing the time taken by a stage to stabilize at a target XY-plane position
          range: LiMiTimeUnit
          ifabsent: LiMiTimeUnit(ms)
          annotations:
            limi_tier: 2
        xy_resolution:
          description: This field describes the XY-plane motion Resolution of a Stage as specified by the Manufacturer.
          range: float
          annotations:
            limi_tier: 2
        xy_resolution_unit:
          description: Unit associated with a value representing the XY-resolution of the motion of a stage
          range: LiMiLengthUnit
          ifabsent: LiMiLengthUnit(nm)
          annotations:
            limi_tier: 2
        xy_position_linearity_error:
          description: This field describes the XY-axis positioning error (typically expressed in % error) associated with a Stage as specified by the Manufacturer.
          range: float
          annotations:
            limi_tier: 2

  LiMiMechanicalStage:
    description:
      A Stage fitted with ball-screw drives or rack mechanisms (sometimes
      equipped with precision calibration) to primarily assist in the
      translational movement of the Sample in the X and Y directions. A
      Mechanical Stage may be built into the Microscope Stand or it may consist
      of a removable insert. It may be manually operated, or it might be driven
      by linear electrodynamic motors, such as for example, in
      computer-controlled digital Microscopes. In some rare cases, a Mechanical
      Stage might also be used for Focusing (Z-axis movement), i.e., in simple
      surveying Microscopes.
    is_a: LiMiStage

  LiMiPiezoElectricStage:
    description:
      An optional piezoelectric-driven sample nano-positioning device associated
      with this Instrument. These devices typically achieve higher precision,
      accuracy and speed with respect to traditional Mechanical Stages.
    is_a: LiMiStage

  ##############################
  # Focus stabilization device #
  ##############################

  LiMiFocusStabilizationDevice:
    description:
      An optional focus stabilization device (also known as, Auto Focus) that
      may be used for bringing an object automatically into focus for this
      instrument. Such devices can be controlled either via an imaging software
      and/or by a hardware device that detects and adjusts the objective or
      sample positions.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      # Arnica has filled
      mechanism:
        description: This field refers to the mechanism employed by a Focus Stabilization Device. Software (also referred to as Image) based methods rely on the Acquisition of a Z-series of images followed by image analysis to determine the best focal position based primarily on contrast comparisons. Hardware based methods rely on an external light beam (typically infrared) that is reflected off the coverslip and whose reflection is measured to determine and correct the focal offset of the sample.
        range: LiMiFocusStabilizationType
        required: true
      algorithm:
        description: In case a Focus Stabilization Device is Software Based, this field refers to the name of the Algorithm used to maintain focus.
      two_step:
        description: This field records whether a Focus Stabilization Device utilizes a 2-step progressive procedure (True) or not (False).
        range: boolean
      wavelength:
        description: This field refers to the Wavelength of the beam that is relevant for a Focus Stabilization Device. For example this might represent the Wavelength of the beam that is reflected against the Coverglass to obtain a measurement of the focal offset of the sample at a given time during Acquisition.This field refers to the Wavelength of the beam that is relevant for this Focus Stabilization Device. For example this might represent the Wavelength of the beam that is reflected against the Coverglass to obtain a measurement of the focal offset of the sample at a given time during Acquisition.
        range: float
      wavelength_range:
        description: Unit associated with a value representing a wavelength
        range: LiMiWavelengthRange
        ifabsent: LiMiWavelengthRange (nm)
        notes:
          - AK made up this default unit

  ####################
  # Optical assembly #
  ####################

  LiMiOpticalAssembly:
    description:
      This is a device that might include one or more Lenses, other Optics and
      Optics Holders. Optical Devices might be custom built or they might also
      be available as pre-assembled units. Such devices might be embedded within
      the Microscope Stand or exist as independent units. Examples include the
      Condenser and the Microscope Tube.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      # Arnica has filled
      filter_ref:
        description: This refers to an available Filter, which is part of this Optical Assembly.
        range: LiMiFilter
      lens_ref:
        description: This refers to an available Lens, which is part of this Optical Assembly.
        range: LiMiLens
      mirrorring_device_ref:
        description: This refers to an available Mirroring Device, which is part of this Optical Assembly.
        range: LiMiMirroringDevice
      optical_aperture_ref:
        description: This refers to an available Optical Aperture, which is part of this Optical Assembly.
        range: LiMiOpticalAperture
      polarization_optics_ref:
        description: This refers to an available Polarization Optics, which is part of this Optical Assembly.
        range: LiMiPolarizationOptics
      prism_ref:
        description: This refers to an available Prism, which is part of this Optical Assembly.
        range: LiMiPrism

  LiMiBeamCollimator:
    description:
      Beam Collimators are Lens Systems that transform a strongly diverging
      light beam into a collimated beam, i.e., a beam where light propagates
      essentially only in one direction, and the beam divergence is weak. Beam
      Collimators typically contain some kind of Focusing Lens, or sometimes a
      curved Mirror, and usually some opto-mechanics for stable mounting and
      possibly adjustment. Beam Expanders can be custom built or they are also
      available as pre-assembled optical devices.
    is_a: LiMiOpticalAssembly

  LiMiBeamExpander:
    description:
      Beam Expanders are Lens Systems whose role is to increase the diameter of
      a collimated input beam to a larger collimated output beam. Beam Expanders
      typically are afocal systems in which object rays enter and exit parallel
      to the optical axis. As such a Beam Expander does not have a focal length.
      In most cases, Beam Expanders are realized as optical telescopes
      consisting of two lenses. Beam Expanders can be custom built or they are
      also available as pre-assembled optical devices.
    is_a: LiMiOpticalAssembly
    attributes:
      configuration:
        description: The configuration of this Beam Expander.
        range: LiMiBeamExpanderConfiguration

  LiMiCondenser:
    description:
      A Condenser is a part of the illuminating system of the microscope which
      consists of one or more lenses (or mirrors), their mounts, and typically a
      Diaphragm. They typically also include a Turret system to facilitate
      switching between different Optics. The are located above the Light Source
      and under the sample in an Upright Microscope, and above the stage and
      below the Light Source in an Inverted Microscope. They are designed to
      collect, control and concentrate light from the Light Source into a cone
      of light that illuminates the specimen. The aperture and angle of the
      light cone must be adjusted (via the size of the Diaphragm) for each
      different Objective.
    is_a: LiMiOpticalAssembly
    attributes:
      correction:
        description:
          The type of Aberration (i.e., failure of an optical system to produce
          a perfect image) this Condenser is design to correct.
        range: LiMiCondenserCorrection
      type:
        description: >-
          This field captures the general category this Condenser belongs to
          according to ISO 10934-1:2002. Specifically, this category refers to
          the type of Correction or Contrast Enhancement Method this Condenser
          is designed to achieve. According to ISO 10934-1:2002, options
          include: 1) Abbe, this is a condenser of simple design introduced by
          Abbe, in which there is only limited correction for spherical
          aberration and none for chromatic aberration. 2) Achromatic-aplanatic,
          this is a in which chromatic aberrations and spherical aberrations
          have been reduced. 3) Cardioid, this is a dark field condenser for
          transmitted light illumination that has spherical aberration and coma
          (i.e., aberration in which the image of an off-axis point object is
          deformed so that the image is shaped like a comet) correction. 4)
          Dark-field, this is a dark-ground condenser designed for dark-field
          microscopy, which for reflected-light microscopy might be located
          within the mount of the objective. 5) Pancratic, this is a condenser
          containing a variable “zoom” (pancratic) lens which allows the size of
          the illuminated field at the object to be varied while the illuminated
          field diaphragm remains of constant size. 6) Phase-contrast, this is
          condenser designed for phasecontrast microscopy. 6) Universal, this is
          a condenser designed for multiple contrast methods such as bright
          field, dark field, phase contrast, differential interference contrast,
          polarized light and modulation contrast.
        range: LiMiCondenserCategory

  LiMiMicroscopeTube:
    description:
      Illumination Tubes are Lens systems, which might be embedded within the
      Microscope Stand and therefore not immediately accessible. They are
      essential for infinity-correction and should be regarded as integral parts
      of the Objective Lens System when magnification and correction are
      considered.
    is_a: LiMiOpticalAssembly
    attributes:
      type:
        description: The general category of this Tube.
        range: LiMiMicroscopeTubeType
      mechanical_length:
        description:
          For Objectives corrected for a finite primary image distance, this is
          the length of the Tube in its simplest form, and it corresponds to the
          distance in air between the Objective and the Camera port. It commonly
          has a value of 160 mm (ISO 9345-1). For infinity-corrected objectives,
          the mechanical tube length is hypothetically considered to be
          infinite.
        range: float
      mechanical_length_unit:
        description: Unit associated with the Mechanical Length value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      optical_length:
        description:
          This is the distance between the back focal plane of the Objective and
          the primary Image plane. This distance is relevant only when using
          finite primary Image distance Objectives.
        range: float
      optical_length_unit:
        description: Unit associated with the Optical Length value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      factor:
        description:
          Factor (q) by which the lateral Magnification at the primary image is
          changed by an intermediate Lens or Lens System inserted between the
          Objective and the primary Image.
        range: float

  #############
  # Detectors #
  #############

  LiMiDetector:
    description:
      A Detector available for an Instrument. An Instrument may have more than
      one Detector of different types, such as a Photomultiplier, or a Camera.
      The Detector ID can be used as a reference within the Channel element. The
      values stored in Detector represent the fixed values, variable values
      modified during the Acquisition go in DetectorSettings.
    is_a: LiMiManufacturerSpecs
    extra_slots:
      allowed: true
    slots:
      - id
      - name
      - object_type
    attributes:
      # Arnica thinks this belongs to and sees it has been completed under core hardware

  LiMiCamera:
    description:
      A Camera is a device that converts optical brightness into an electrical
      signal using a grid of pixel sensor unit cells and then reproduces an
      image of the specimen. An Instrument may have more than one camera of
      different types, such as traditional CCD, EMCCD, Intensified EMCCD, sCMOS,
      or Analog Video.
    is_a: LiMiDetector
    attributes:
      # Arnica has filled
      array_width:
        description: This field records the Width of a Camera chip or sensor area, expressed in Pixel.
        range: integer
      array_height:
        description: This field records the Height of a Camera chip or sensor area, expressed in Pixel.
        range: integer
      pixel_width:
        description: This field records the Physical Width of each Camera Pixel.
        range: float
        required: true
      pixel_width_unit:
        description: Unit associated with the value representing the width of a camera pixel
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit (µm)
      pixel_height:
        description: This field records the Physical Height of each Camera Pixel.
        range: float
        required: true
      pixel_height_unit:
        description: Unit associated with the value representing the height of a camera pixel
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit (µm)
      illumination:
        description: This field records the type of illumination the Camera chip receives.
        range: LiMiCameraIllumination
        required: true
        annotations:
          limi_tier: 2
      manufacturer_offset:
        description: This field reports the Camera Offset when it is pre-set by the Manufacturer. The Offset is an electronic baseline added to the output signal from the sensor to ensure that the displayed signal level is always a positive number of counts.
        range: float
        annotations:
          limi_tier: 2
      color:
        description: This field records whether a camera is a Color Camera and what type it is.
        range: LiMiCameraColorMode
        annotations:
          limi_tier: 2
      pixel_well_capacity:
        description: This field records the maximum amount of charge each Pixel Well can hold, measured in electron counts.
        range: integer
        required: true
        annotations:
          limi_tier: 3
      pixel_well_capacity_unit:
        description: Unit associated with a value representing the charge a camera pixel well can hold
        range: LiMiElectricChargeUnit
        ifabsent: LiMiElectricChargeUnit (e-)
        annotations:
          limi_tier: 3
      maximum_frame_rate:
        description: This field records the maximal rate at which a camera can acquire a single full-frame
        range: float
        required: true
        annotations:
          limi_tier: 2
      maximum_frame_rate_unit:
        description: Unit associated with a value representing the maximum frame rate associated with a camera
        range: LiMiFrequencyUnit
        ifabsent: LiMiFrequencyUnit (fps)
        annotations:
          limi_tier: 2
      maximum_readout_rate:
        description: This field records the maximal pixel Readout Rate allowed by a Camera.
        range: float
        required: true
        annotations:
          limi_tier: 3
      maximum_readout_rate_unit:
        description: Unit associated with a value representing the maximum pixel read out rate of a camera
        range: LiMiFrequencyUnit
        ifabsent: LiMiFrequencyUnit (MHz)
        annotations:
          limi_tier: 3
      vertical_clock_speed:
        description: This field records the maximal speed at which each vertical column of pixels in the camera chip can be shifted down and read.
        range: float
        annotations:
          limi_tier: 3
      vertical_clock_speed_unit:
        description: Unit associated with a value representing the vertical clock speed of a camera chip
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit (μs)
        annotations:
          limi_tier: 3

  LiMiAnalogVideoCamera:
    description: A device used to capture Analog Videos.
    is_a: LiMiCamera

  LiMiCCDCamera:
    description: A Charged Coupled Device Camera.
    is_a: LiMiCamera
    attributes:
      type:
        description: The type of CCD Camera.
        range: LiMiCCDType
      architecture:
        description:
          The architecture of this CCD Camera and its associated transfer mode.
        range: LiMiCCDArchitecture
      register_well_capacity:
        description:
          The maximum amount of charge each read-out register can hold, measured
          in electron counts.
        range: integer

  LiMiCMOSCamera:
    description: A complementary meta-oxide-semiconductor camera.
    is_a: LiMiCamera
    attributes:
      type:
        description: The type of CMOS Camera.
        range: LiMiCMOSType

  LiMiIntensifiedCamera:
    description: An intensified Camera.
    is_a: LiMiCamera
    attributes:
      sensor_type:
        description: The type of Sensor used in this Camera.
        range: LiMiSensorType
      intensifier_type:
        description: The type of Intensifier used in this Camera.
        range: LiMiIntensifiedCCDType
      register_well_capacity:
        description:
          The maximum amount of charge each read-out register can hold, measured
          in electron counts.
        range: integer

  LiMiPointDetector:
    description:
      Any Detector that collects light from a restricted point-like area of an
      image. These detectors are typically used in Laser Scanning Confocal
      Microscopy.
    is_a: LiMiDetector
    attributes:
      # Arnica has filled
      coating:
        description: This field records the Coating Material used to increase the photoelectric properties of the metallic cathode used in a Detector. The coating releases electrons much more readily than the underlying metal, allowing it to detect the low-energy photons in infrared radiation. The lens transmits the radiation from the object being viewed to a layer of coated glass. The photons strike the metal surface and transfer electrons to its rear side. The freed electrons are then collected to produce the final image.
        required: true
        range: LiMiCoatingMaterial
      signal_processing:
        description: This field describes the method employed by a device to process the output signal and convert it into a measure of incident light intensity. In Photon Counting mode the system is set in a manner in which each photon hitting the head of the detector gives either no or 1 diskrete pulse. This way by counting the pulses one is sure to be counting individual photons. In Analog mode the system is set so the mean value of all signal pulses is used as a measure of intensity.
        range: LiMiSignalProcessingMode
      response_time:
        description: This field records the Time required for a Detector to respond to an optical input.
        range: float
        annotations:
          limi_tier: 3
      response_time_unit:
        description: Unit associated with a value representing the response time of a point detector
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit(ms)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit
      dead_time:
        description: This field records the Time required for a Detector to become responsive again after being hit by a photon.
        range: float
        required: true
        annotations:
          limi_tier: 3
      dead_time_unit:
        description: Unit associated with a value representing the dead time of a point detector
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit(ms)
        annotations:
          limi_tier: 3
        notes:
          - AK made up this default unit
      radiant_sensitivity:
        description: This field records the Time required for a Detector to become responsive again after being hit by a photon.
        range: float
        required: true
        annotations:
          limi_tier: 3
      radiant_sensitivity_unit:
        description: Unit associated with a value representing the radiant sensitivity of a point detector
        range: LiMiPowerUnit
        annotations:
          limi_tier: 3
        notes:
          - AK could not make up this default unit
          - AK has also found that this should be in units of A/W.

  LiMiPhotoMultiplier:
    description:
      A Photomultiplier Tube (PMT) is a photoemissive device in which the
      absorption of a photon results in the emission of an electron and it is
      used for the detection of very weak signals. These Detectors work by
      amplifying the electrons generated by a photocathode exposed to a photon
      flux. The higher the supplied voltage (PMTVoltage setting), the greater
      the amplification of the current (PMTGain setting) and thus sensitivity,
      but also the higher the noise in the acquired image. The amplifier offset
      (PMTOffset setting) defines black level setting of the image. A PMT has no
      inherent spatial information of the image.
    is_a: LiMiPointDetector
    attributes:
      # Arnica has filled
      collection_efficiency:
        description: This field measures the probability that photoelectrons will land on the effective area of the first dynode of the photomultiplier stage. While there might be dispersion at the second and later dynodes, this tends to have less of an effect on the total collection efficiency as the number of emitted electrons increases greatly.
        range: float
        required: true
        annotations:
          limi_tier: 2
      multianode:
        description: This field records whether (True) or not (False) a Photo Multiplier Tube is composed of an array of multiple
        range: boolean
        required: true
        annotations:
          limi_tier: 2
      multianode_channel_nr:
        description: In case a Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field records the number of Channels it consists of.
        range: integer
        annotations:
          limi_tier: 3
      multianode_arrangement:
        description: In case a Detector is a Multianode composed of an array of multiple Photomultiplier Tubes, this field records the number of Channels it consists of.
        range: LiMiMultianodeArrangement
        annotations:
          limi_tier: 3
      head_on:
        description: This is True if the Photocathode is positioned at either end of the vacuum tube. This is False if the photocathode element is located on the side of the vacuum tube (side-on geometry).
        range: boolean
        annotations:
          limi_tier: 3

  LiMiPhotoDiode:
    description:
      A Photovoltaic Detector. Most photodiodes used in confocal microscopes are
      Avalanche Photodiode (APD) which because of the amplification gain have
      good sensitivities and less dark current.
    is_a: LiMiPointDetector
    attributes:
      avalanche:
        description:
          Whether (true) or not (false) this is an "Avalanche" photodiode.
        range: boolean
      PIN_junction:
        description:
          Whether this photodiode is based on a Positive-Intermediate-Negative
          (PIN) or a Positive-Negative (PN) architecture.
        range: boolean

  LiMiHybridPhotoDetector:
    description: A hybrid Photomultiplier and Avalanche Photodiode (APD).
    is_a: LiMiPointDetector

  LiMiGenericDetector:
    description:
      A Generic Detector as a collection of Key/Value pairs, which are stored in
      a Map. One of the other detector elements should always be used in
      preference to this if possible.
    is_a: LiMiDetector
    attributes:
      map:
        description:
          A mapping of key/value pairs used to store customized metadata that
          describes this detector.
        range: LiMiMapEntry
        multivalued: true
        inlined: true
        inlined_as_list: false

  LiMiGenericFilter:
    description:
      A generic Filter positioned along the Light Path in addition to the
      canonical fluorescence Excitation and Emission Filters.
    notes:
      - FIXME Should not be needed, because in this schema the parent Filter
        class is _not_ abstract, so a "generic" filter can simply be a Filter.
    is_a: LiMiFilter

