id: https://example.invalid/limi/v2-10/basic/hardware
name: limi-basic-hardware
title: LiMi Basic Schema – Hardware Specifications
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Hardware Specifications” section
  of the “Basic” module of the LiMi model.
notes:
  - This schema is not intended to be used on its own. Use limi-basic instead.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  orcid: https://orcid.org/
default_prefix: limi
default_range: string

classes:
  ##############
  # Instrument #
  ##############

  LiMiInstrument:
    description:
      This class describes the Instrument used to capture an image. It is
      primarily a container referring to the list of hardware components in a
      given Microscope.
    notes:
      - This is a redefinition of the class already defined in the Core module,
        to add the attributes specified in the Basic module. As with the
        original definition, all the new attributes are in fact defined in a
        separate mixin, that is inherited by this class.
      - It is unclear whether such a redefinition is actually valid in LinkML.
        According to the LinkML specification, strictly speaking it is not, but
        LinkML’s own reference implementation says it is.
    is_a: LiMiManufacturerSpecs
    mixins:
      - LiMiInstrumentCoreMixin
      - LiMiInstrumentBasicMixin

  LiMiInstrumentBasicMixin:
    description: Basic-level attributes for the LiMiInstrument class.
    mixin: true
    attributes:
      software:
        description:
          A commercial or open-source Software, script, macro, plugin or module
          utilized for any Image Acquisition or Quality Control task related to
          this Instrument.
        range: LiMiSoftware
        multivalued: true
        inlined: true
        inlined_as_list: true

  #####################
  # Microscope stands #
  #####################

  LiMiUprightMicroscope:
    description: An upright Microscope Stand.
    is_a: LiMiMicroscopeStand

  #######################
  # Software components #
  #######################

  LiMiSoftware:
    description:
      A commercial or open-source Software, script, macro, plugin or module
      utilized for any Image Acquisition or Quality Control task.
    is_a: LiMiObject
    slots:
      - id
      - name
      - object_type
    attributes:
      version:
        description: The Version of this Software.
      developer:
        description:
          The Developer(s) of this Software. In case this is a non-commercial,
          open-source Software, this refers to the name of the individual or
          consortium who developed the Software. In the case of a commercial
          Software, this might refer to the Commercial entity but it can also be
          used to refer to the individual developer, if known.
      website:
        description:
          The URL address of any Website where the Software can be obtained. In
          case of open-source Softare this field should record the URL for the
          Git repository from which to obtain the source code.
        range: uri
      primary_publication_id:
        description:
          A Unique Identifier for the Primary Publication describing this
          Software. Examples include, Digital Object Identifier (DOI), PubMed
          Central Identifier (PMCID), ArXiv.org ID, etc.
      open_source:
        description:
          Whether this Software is Open-Source (True) or Proprietary (False).
        range: boolean
      macro:
        description:
          Whether this Software is a Macro or a Script (True) or is it a full
          free-standing program (False).
        range: boolean
      build:
        description: The specific build of this Software.
      patch:
        description:
          The version for an optional Patch, HotFix or Update used for this
          Software. A Patch (aka HotFix, or Update) is a set of changes to a
          computer program or its supporting data designed to update, fix, or
          improve it. This includes fixing security vulnerabilities, and other
          bugs, with such patches usually being called bugfixes or bug fixes,
          and improving the functionality, usability, or performance.
      release_date:
        description: The date in which this Software was released.
        range: date
      language:
        description: The computer language in which this Software was developed.
      modules:
        description:
          Software modules that were used in association with this Instrument.
        range: LiMiSoftwareModule
        multivalued: true
        inlined: false

  LiMiAcquisitionSoftware:
    description:
      A commercial or open-source Software, script, macro, plugin or module
      utilized for driving this Instrument during Image Acquisition.
    is_a: LiMiSoftware

  LiMiSoftwareModule:
    description:
      A commercial or open-source software module utilized for any Image
      Acquisition, or Quality Control task.
    is_a: LiMiSoftware
