id: https://example.invalid/limi/v1/core/units
name: limi-core-units
title: LiMi Core units
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines defines the enumerations representing the units that are
  used throughout the overall set of of schemas.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v1/
  orcid: https://orcid.org/
default_prefix: limi


enums:

  LiMiPowerUnit:
    description: >-
      Available values to describe the unit of a value that represents a
      power.
    notes:
      - >-
        This comes directly from the OME model. The NBO v02-01
        specification mentions a "unit:IlluminationPowerUnit" but,
        AFAICT, does not define it anywhere.
    permissible_values:
      YW:
        title: yotta watt
      ZW:
        title: zetta watt
      EW:
        title: exa watt
      PW:
        title: peta watt
      TW:
        title: tera watt
      GW:
        title: giga watt
      MW:
        title: mega watt
      kW:
        title: kilo watt
      hW:
        title: hecto watt
      daW:
        title: deca watt
      W:
        title: watt
      dW:
        title: deci watt
      cW:
        title: centi watt
      mW:
        title: milli watt
      μW:
        title: micro watt
      nW:
        title: nano watt
      pW:
        title: pico watt
      fW:
        title: femto watt
      aW:
        title: atto watt
      zW:
        title: zepto watt
      yW:
        title: yocto watt

