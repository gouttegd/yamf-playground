    description:
      The inert gas vapor contained in the bulb of an Arc lamp. The nature of
      the gas determines the spectral behavior of the lamp. At low pressure, Hg
      lamps emit a characteristic line spectrum, which becomes more uniform as
      the lamp heats up. On the other hand, Xe lamps emit light of high
      luminance, high color temperature, and an almost continuous spectrum
      distributed from the ultraviolet to the infrared.
    permissible_values:
