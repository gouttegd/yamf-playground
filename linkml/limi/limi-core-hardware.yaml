id: https://example.invalid/limi/v02-10/core/hardware
name: limi-core-hardware
title: LiMi Core Schema – Hardware Specifications
description: >-
  This schema is part of the set of LinkML schemas for the QUAREP Light
  Microscopy Model (hereafter referred to as “LiMi model”).

  It defines the entities that belong to the “Hardware Specifications” section
  of the “Core” module of the LiMi model.
notes:
  - This schema is not intended to be used on its own. Use limi-core instead.
created_by: orcid:0000-0002-6095-8718

prefixes:
  limi: https://example.invalid/limi/v02-10/
  orcid: https://orcid.org/
default_prefix: limi
default_range: string

classes:
  LiMiManufacturerSpecs:
    description:
      This describes the Manufacturer specifications for a hardware component.
    # This describes the Manufacturer specifications for this component (i.e., Manufacturer Name, Model designation and Catalog Number).
    notes:
      - This is the base class for most classes in this schema.
    is_a: LiMiObject
    attributes:
      manufacturer:
        description:
          The company, research group or individual who built or manufactured
          this hardware.
        # This field refers to...
        annotations:
          recommended_in_methods: true
      model:
        description:
          The Model name or any other designation the Manufacturer uses for this
          component.
          # This field refers to...
        annotations:
          recommended_in_methods: true
      catalog_number:
        description:
          The Catalog, Part of Serial Number used by the Manufacturer to
          uniquely identify this component.
        # This field records...
        annotations:
          recommended_in_methods: true
      lot_number:
        description:
          The Lot Number used by the Manufacturer to refer to a specific
          production batch or lot for this component.
        annotations:
          limi_tier: 3
      map_annotations:
        description: Arbitrary key/value pair annotations.
        annotations:
          limi_tier: 3
        range: LiMiMapAnnotation
        multivalued: true
      specs_files:
        description:
          A PDF file that contains the specifications for this hardware
          component as provided by the Manufacturer.
        # This element refers to...
        annotations:
          limi_tier: 3
        range: LiMiFileAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
      additional_vendor_information:
        description:
          Vendor-specific additional information about this component.
        annotations:
          limi_tier: 3
        comments:
          - This attribute is intended as a last-resort solution to capture
            information that cannot be captured using any other available model
            elements or the map annotation feature.
            # This element is intended to be used as a last-resort solution to capture vendor-specific Additional Information about this hardware component, which cannot be described using either available model elements (Classes or Attributes) or the Map Annotation feature of the schema. The use of this feature should not be intended as a way to hide information that the Imaging Community has designated as essential to ensure rigor and reproducibility. In case this feature is used, the Vendor is fully responsible for this information, including but not limited to, making sure this information is appropriately recorded and kept up to date.
        range: LiMiAdditionalVendorInformation
        inlined: true

  LiMiAdditionalVendorInformation:
    description:
      Vendor-specific additional information about a hardware component.
    is_a: LiMiObject
    slots:
      - id
    attributes:
      vendor_name:
        description: The Name of the Vendor responsible for this Information.
      bin_data:
        description:
          The additional information, as a blob of arbitrary raw data.
        range: LiMiBase64Binary

  LiMiInstrument:
    description:
      This class describes the Instrument used to capture an image. It is
      primarily a container referring to the list of hardware components in a
      given Microscope.
    # This element describes the Instrument used to capture the Image. It is primarily a container referring to the list of hardware components included in a given Microscope. The list consists of the Microscope Stand, Microscope Table, Light Source, Light Source Coupling, Sample Holder, Focusing, Objective, Filter, Dichroic, Additional Lens (including a commonly used Magnification Changer, also known as Optovar), Additional Mirroring Device, Polarization Optics, Prism, Optical Aperture, Optical Device, Detector and Calibration Tool. The Filter element can be either composed of separate Excitation, Emission filters, and Dichroic mirrors or a single Filter Set. An Instrument might have multiple Light Sources, Detectors, Objectives, and Filters, etc. Each of these has its own ID attribute, which can be referred to from the Image, Plane or more commonly Channel elements associated with a given Image Acquisition session. It is understood that the Light Path configuration can be different for each Channel, but cannot be different for each timepoint or each Plane of an XYZ stack.
    notes:
      - The attributes for this class are described in a separate mixin because
        the entire class is defined across several LiMi modules.
      - Essentially, the rest of this entire schema serves to describe the
        attributes of this class.
    is_a: LiMiManufacturerSpecs
    mixins:
      - LiMiInstrumentCoreMixin
    extra_slots:
      allowed: true

  LiMiInstrumentCoreMixin:
    description: Core-level attributes for the LiMiInstrument class.
    mixin: true
    slots:
      - id
      - name
    attributes:
      stand:
        description:
          The core structure of this Instrument, which might also be referred to
          as its Body.
        # The core structure of this Microscope, which might also be referred to as Body, Frame, or Platform.
        range: LiMiMicroscopeStand
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      light_sources:
        description: The Light Source(s) available for this Instrument.
        # This element describes one or more Light Source(s) available for this Instrument.  An Instrument may have several Light Sources of different types (Laser, Light Emitting Diode, Filament, Arc etc.). A typical fluorescence Microscope has two Light Sources, one for Transmitted light and one for Fluorescence light.
        range: LiMiLightSource
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      objectives:
        description: The Objective(s) available for this Instrument.
        range: LiMiObjective
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      filters:
        description: The Filter(s) available for this Instrument.
        # This element describes an optical Filter positioned in the Light Path for one or more Channels available for this Instrument. An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration direction, and/or intensity of the radiation which it transmits or reflects. An Instrument may have several Filters of different types, such as an Excitation, Emission, Neutral Density or an additional Generic Filter positioned in the Light Path for different purposes. For each fluorescence Image there should be at least one Filter element specified per Channel. This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter Turret, Filtr Wheel, or Filter Slider. Note: Filter Holder is not the same as a Filter Set.
        range: LiMiFilter
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

  ####################
  # Microscope stand #
  ####################

  LiMiMicroscopeStand:
    description: The core structure of a Microscope.
    # The core structure of this Microscope, which might also be referred to as Body, Frame, or Platform.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
      - object_type
    attributes:
      type:
        description: The general category to which this Microscope belongs.
        # The general category to which this Microscope belongs. Options include a Compound Microscope is a Microscope in which the primary image is generated by an objective or an objective and a tube-lens, and in which the Sample is observed through an eyepiece. A Custom Microscope is specially designed for specialized purposes. An Electrophysiology Microscope is a Microscope dedicated to electrophysiological observation and manipulation. A Lightsheet Microscope is a Microscope in which in contrast to epifluorescence microscopy only a thin slice (usually a few hundred nanometers to a few micrometers) of the sample is illuminated perpendicularly to the direction of observation. A Stereo Microscope (also known as Dissecting Microscope) is a low-power, binocular Microscope with long free working distance used for dissecting. Generally in this type of Microscope the object is observed by each eye from a slightly different angle, thus causing stereoscopic perception.
        annotations:
          recommended_in_methods: true
        range: LiMiMicroscopeType
        required: true
        notes:
          - FIXME Shouldn’t that be an attribute of the Instrument rather than
            of the MicroscopeStand?
      origin:
        description: The origin of this microscope stand.
        # This describes the origin of this microscope stand. Specifically it specifies whether this Microscope Stand was purchased from a Commercial vendor and is being used as-is (i.e., Commercial- as is), purchased from a Commercial vendor and subsequently Modified for a specialized application (i.e., Commercial- custom-modified) or entirely Custom-built from scratch (i.e., Custom-built).
        annotations:
          recommended_in_methods: true
        range: LiMiMicroscopeOriginType
      eyepiece_field_number:
        description:
          The diaphragm size of the Microscope eyepiece expressed in mm.
        # The Field Number represents the diaphragm size of the Microscope eyepiece expressed in mm.
        annotations:
          limi_tier: 3
        range: float

  LiMiInvertedMicroscope:
    description: An inverted Microscope Stand.
    # This is a Microscope in which the object is observed from beneath the stage.
    is_a: LiMiMicroscopeStand

  #################
  # Light sources #
  #################

  LiMiLightSource:
    description: A Light Source on an Instrument.
    # This element describes one or more Light Source(s) available for this Instrument. An Instrument may have several Light Sources of different types (Laser, Light Emitting Diode, Filament, Arc etc.). A typical fluorescence Microscope has two Light Sources, one for Transmitted light and one for Fluorescence light.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
      - object_type
    attributes:
      purchase_date:
        description: The Date on which this Light Source was purchased.
        # This field records the...
        range: date
      illumination_power_reporting_statistic:
        description:
          The statistic used by the Manufacturer to report the nominal
          illumination power output emitted by this Light Source at Peak
          Wavelength.
        # This field reports the...
        range: LiMiIlluminationPowerReportingStatistic
      illumination_power_reporting_position:
        description:
          The position where the reported Illumination Intensity value was
          obtained as reported by the Manufacturer.
        # This field records the...
        range: LiMiIlluminationPowerReportingPosition

  LiMiArc:
    description:
      Represents a Light Source that is an Arc lamp. An Arc lamp is a discharge
      lamp that produces light by an electric arc (also called a voltaic arc),
      which is typically generated between metal electrodes and travels through
      an inert gas in in a glass bulb. The inert gas can be Mercury (He), Xenon
      (Xe), or a mixture of the two. The choice of the gas is important because
      its nature determines the spectral behavior of the lamp.
    # An Arc lamp is a discharge lamp that produces light by an electric arc (also called a voltaic arc), which is typically generated between metal electrodes and travels through an inert gas in a glass bulb. The inert gas can be Mercury (He), Xenon (Xe), or a mixture of the two. The choice of the gas is important because its nature determines the spectral behavior of the lamp. Refer to Type for more information about this aspect.
    is_a: LiMiLightSource
    attributes:
      type:
        description: The inert gas vapor contained in the Arc lamp bulb.
        range: LiMiArcType
      illumination_wavelength_ranges:
        description:
          The range(s) of wavelengths this device is designed for, according to
          the Manufacturer.
        range: LiMiIlluminationWavelengthRange
        multivalued: true

  LiMiFilament:
    description:
      Represents a Light Source that is a Filament lamp. A Filament lamp is an
      incandescent Light Source with a wire filament (usually tungsten), which
      is heated by the passage of an electric current to such a high temperature
      that it flows with visible light (incandescence). The emitted spectrum is
      continuous, and it approximates that of a black-body radiator.
    is_a: LiMiLightSource
    attributes:
      type:
        description: The type of Filament lamp Light Source.
        # This field records the type of Filament lamp Light Source. A Halogen lamp is a Filament lamp whose envelope contains halogen vapor, which reduces the loss of tungsten from the filament. This, in turn, allows to reach a high filament temperature and consequent higher luminance, higher color temperature, and longer operating life than a Standard Filament lamp of the same input power.
        range: LiMiFilamentType
      illumination_wavelength_ranges:
        description:
          The range(s) of wavelengths this device is designed for, according to
          the Manufacturer.
        range: LiMiIlluminationWavelengthRange
        multivalued: true

  LiMiLaser:
    description:
      A Light Source which emits coherent radiation at high spectral
      concentrations of radiance and minimal solid angles. This includes proper
      Light Amplification by Stimulated Emission of Radiation (LASER) sources
      that emit light through a process of optical amplification based on the
      stimulated emission of electromagnetic radiations. It also includes
      Optical Parametric Oscillator (OPO) sources that uses a kind of LASER
      resonator but based on optical gain from parametric amplification in a
      nonlinear crystal rather than from stimulated emission.
    is_a: LiMiLightSource
    attributes:
      type:
        description: The general category of the laser.
        # The general category of the laser used for this experiment (e.g., Semiconductor Laser Diode, Solid state, Gas, etc.).
        range: LiMiLaserType
      tunable:
        description: Whether this Laser is Tuneable to different Wavelengths.
        # Whether (True) or not (False) this Laser is Tuneable to different Wavelengths
        range: boolean
      pulse:
        description:
          Whether this Laser emits light in the form of optical pulses (i.e.,
          light flashes; True) or as a Continuous Wave (CW; False).
        range: boolean
      laser_medium:
        description: The material out of which this Laser is constructed.
        # This field captures the...
        range: LiMiLaserMedium
      is_pumped:
        description: Whether this Laser is a pumped Laser.
        # Whether (True) or not (False) this is a pumped Laser.
        range: boolean
      repetition_rate:
        description:
          In the case this is a pulsed Laser, this is the frequency of the laser
          pulses.
        # In the case this is a pulsed Laser (Pulse is True), this field (also known as Pulse Frequency) describes the frequency of laser pulses. The default unit is Hz.
        range: float
      repetition_rate_unit:
        description: Unit associated with the Repetition Rate value.
        range: LiMiFrequencyUnit
        ifabsent: LiMiFrequencyUnit(Hz)
      frequency_multiplication:
        description:
          The optical frequency multiplication factor that may be specified for
          this Laser.
        # This field captures the...
        range: float
      modulation_mechanism:
        description: The modulation mechanism used for this Laser.
        # The Modulation Mechanism used for this Laser. Examples include, None, Direct, Acousto-Optical Beam Splitter (AOBS), Acousto-Optical Tunable Filter (AOTF), Acousto-Optical Modulator (AOM).
        range: LiMiLaserModulation
      laser_class:
        description: The Safety Class this Laser belongs to.
        # This describes the safety Class this Laser belongs to. Laser Classes are defined based on their potential for causing injury to humans’ eyes and skin.
        range: LiMiLaserSafetyClass
      is_pump:
        description: Whether this Laser serves as a Pump for a downstream Laser.
        # Whether (True) or not (False) this Laser serves as a Pump for a downstream Laser.
      position:
        description: The position of this Laser on a Multi Laser Engine.
        # This field captures the...
        range: integer
        minimum_value: 1
      pulse_duration:
        description:
          In the case this is a pulsed laser, this is the duration of each Laser
          pulse.
        # In the case this is a pulsed Laser (Pulse is True), this field describes the duration of each Laser pulse
        range: float
      pulse_duration_unit:
        description: Unit associated with the Pulse Duration value.
        range: LiMiTimeUnit
        ifabsent: LiMiTimeUnit(ms)
      pump:
        description:
          In the case this is a Pumped Laser, this is a reference to the
          upstream Laser used to pump this one.
        # AK: I strongly prefer DGG's description over the one in the model.
        # In case the primary Laser is Pumped, this element describe a secondary Laser, positioned upstream of the primary Laser and used to pump it.
        range: LiMiLaser
        inlined: false
      illumination_wavelength_ranges:
        description:
          The range(s) of wavelengths this device is designed for, according to
          the Manufacturer.
        range: LiMiIlluminationWavelengthRange
        multivalued: true

  LiMiLightEmittingDiode:
    description:
      A Light Emitting Diode (LED) is a solid-state semiconductor Light Source
      that emits light when current flows through it. Electrons in the
      semiconductor recombine with electron holes, releasing energy in the form
      of photons. The color of the light (i.e., the energy of the photons) is
      determined by the energy required for electrons to cross the bandgap of
      the semiconductor. White light may be obtained by using multiple
      semiconductors or a layer of light-emitting phosphor on the semiconductor
      device.
    is_a: LiMiLightSource
    attributes:
      type:
        description: The general category of this Light Emitting Diode.
        # This field captures the...
        range: LiMiLightEmittingDiodeType
      led_modules:
        description:
          The individual LED modules that make up this Light Emitting Diode
          Light Source.
        # A Light Emitting Diode (LED) Light Source is often composed of multiple modules each with its own Wavelength characteristics. An individual LED module. Multiple of this elements may be used.
        range: LiMiLEDModule
        multivalued: true

  LiMiLEDModule:
    description: A single module within a Light Emitting Diode Light Source.
    is_a: LiMiObject
    attributes:
      projection_angle:
        description: The angle at which this LED module projects the light beam.
        # This field records the...
        range: float
      projection_angle_unit:
        description: Unit associated with the Projection Angle value.
        range: LiMiAngleUnit
      illumination_wavelength_ranges:
        description:
          The range(s) of wavelengths this device is designed for, according to
          the Manufacturer.
        range: LiMiIlluminationWavelengthRange
        multivalued: true

  LiMiWavelengthRange:
    description:
      A range of Wavelength a device is designed for, according to its
      Manufacturer.
    is_a: LiMiObject
    attributes:
      peak_wavelength:
        description:
          The nominal Wavelength associated with the peak response rate of this
          device.
        # This field records the...
        range: float
      peak_wavelength_unit:
        description: Unit associated with the Peak Wavelength value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      cut_on:
        description: The wavelength below which the response rate is below 50%.
        # CutOn is the Wavelength below which the response rate is below 50%. In case a CutOn Wavelength is not available, such as in the case of a ShortPass or Notch configuration, please enter 000.
        range: float
      cut_on_unit:
        description: Unit associated with the Cut On value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      cut_off:
        description: The wavelength below which the response rate is below 50%.
        # CutOff is the Wavelength below which the response rate is below 50%. In case a CutOff Wavelength is not available, such as in the case of a LongPass configuration, please enter 000.
        range: float
        notes:
          - FIXME Shouldn’t that be the wavelength _above_ which the response
            rate is below 50%?
          # AK: According to EdmundOptics, yes.
      cut_off_unit:
        description: Unit associated with the Cut Off value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      wavelength_profile_file:
        description:
          A file containing the Wavelength profile of this hardware component.
        # This element consists of...
        range: LiMiFileAnnotation
        inlined: true

  LiMiIlluminationWavelengthRange:
    description:
      A range of wavelength a Light Source is designed for, according to its
      Manufacturer.
    is_a: LiMiWavelengthRange
    attributes:
      illumination_power:
        description:
          The nominal Illumination Power (also known as Power Output or
          Illumination Intensity) emitted at Peak Wavelength by the Light
          Source, according to the Manufacturer.
        # This field records...
        range: float
      illumination_power_unit:
        description: Unit associated with the Illumination Power value.
        range: LiMiPowerUnit
        ifabsent: LiMiPowerUnit(mW)

  #############
  # Objective #
  #############

  LiMiObjective:
    description:
      The Microscope's Objective lens consists of a lens, its mount, and any
      associated parts. It is the part of the imaging system, which forms a
      primary image of the object, either alone or in conjunction with a tube
      lens. The Objective typically consists of a compound lens consisting of
      several simple lenses (elements), usually arranged along a common axis.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
    attributes:
      magnification:
        description:
          The Magnification of the Objective as specified by the Manufacturer -
          i.e., 60 represents a 60X lens.
        # This field captures...
        range: float
      lens_na:
        description:
          The nominal Numerical Aperture (NA) of this Objective as specified by
          the Manufacturer, expressed as a real number. NA is a number that was
          defined initially by Abbe to characterize Objectives and Condensers.
          NA can be calculated by the expression "n sin alpha", where n is the
          Refractive Index of the medium between the Lens and the Sample, and
          alpha is half the Angular Aperture of the Lens. NA is a measure of how
          much of the illumination that leaves the specimen actually passes
          through the Lens. The larger the NA, the more information the lens can
          transmit. Expected range 0.02 – 1.5.
        # AK: what is NBSP?
        # This field captures...
        range: float
      correction:
        description:
          The type of optical correction (i.e. chromatic correction, or flatness
          correction, etc.) associated with this Objective.
        # This field captures...
        range: LiMiObjectiveCorrectionType
      immersion_type:
        description:
          The general category of the Immersion Liquid this Objective is
          designed for, according to the Manufacturer. If the general category
          is not "Air", the actual Immersion Liquid that was used during the
          Acquisition of a specific Image must be specified in Objective
          Settings.
        # According to ISO 10934-1:2002, an Immersion Liquid is a liquid (commonly immersion oil, water or glycerol) specified as suitable for use in the space between the front of an immersion lens and the object NOTE Because the immersion liquid is considered in the computing of corrections to be part of the lens, its refractive index and dispersion (or Abbe number) are critical. Please refer to ISO 8036-1 for more details on Immersion Oil. This field describes the general category of the Immersion Liquid this Objective is designed for, according to the Manufacturer. If the general category is not "Air", the actual Immersion Liquid that was used during the Acquisition of a specific Image must be specified in Objective Settings.
        range: LiMiObjectiveImmersionType
      working_distance:
        description:
          The Working Distance of this Objective under normal operating
          conditions. The Working Distance is the distance (in air, or in the
          specified immersion liquid) between the front of an Objective and the
          surface of the cover glass or of th specimen if uncovered.
        # This field reports the...
        range: float
      working_distance_unit:
        description: Unit associated with the Working Distance value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      iris:
        description:
          Whether this Objective was fitted with an Iris. Manufacturers offer
          high NA Objectives, which are equipped with an internal Iris Diaphragm
          that increases image contrast during digital imaging to compensate for
          image flare artifacts due to light emitted from areas outside of the
          focal plane. Opening or closing the Iris Diaphragm determines the size
          of the Objective rear aperture yielding a variable NA range between
          0.5 and the Objective’s upper limit.
        # This field records whether...
        range: boolean
      calibrated_magnification:
        description:
          The Magnification of the Objective as measured via a calibration
          process.
        # This field captures the Magnification of the Objective as measured via a calibration process- i.e., '59.987' for a 60x lens.
        range: float
      infinity_corrected:
        description:
          Whether this Objective is infinity corrected. An infinity-corrected
          Objective is corrected for an infinite sample to primary image
          distance and needs to be used with a Tube Lens of appropriate focal
          length to obtain its nominal magnification.
        # This field records whether...
        range: boolean
      contrast_modulation:
        description:
          The type of contrast modulation plate present in this Objective, if
          any.
        # This field specifies the presence in this Objective of a contrast modulation plate, such as a Phase Ring (Ph1, Ph2, Ph3), a Hoffman modulator, a Varel modulator, or similar.
        range: LiMiObjectiveContrastModulationPlate
      dic:
        description:
          Whether (True) the Objective is designed for Differential Interference
          Contrast (DIC) or not (False). DIC is a contrast modality due to
          double-beam interference in which two waves that fall on the object
          plane or image plane are separated laterally by a distance similar to
          the minimum resolvable distance.
        # This field specifies...
        range: boolean
      light_type:
        description:
          Whether this Objective is designed for a special Light application
          (e.g., IR or UV).
        # This field specifies...
        range: LiMiObjectiveLightType
      correction_collar:
        description: Whether this Objective is fitted with a Correction Collar.
        # This field records whether (True) or not (False) the Objective was fitted with a Correction Collar. When using high NA dry Objectives (NA 0.8 or greater), cover glass thickness variations of only a few micrometers, immersion medium, and temperature changes result in dramatic image degradation due to aberration. To compensate for these errors, the more highly corrected Objectives are equipped with a Correction Collar mechanism, which is provided to adjust the central lens group position to compensate for deviations from correct optical path length due to changes in Cover Glass Thickness, the nature of the Immersion Liquid, different Numerical Apertures, and Temperature.
        range: boolean
        notes:
          - FIXME This should not be needed? If there is no Correction Collar,
            then the correction_collar_type attribute can simply be left unset.
      correction_collar_type:
        description:
          The type of Correction Collar this Objective is fitted with, if any.
        # This field records the type of Correction Collar with which this Objective is fitted. In case the Objective has more than one Correction Collar please enter "Multi" and provide more details in Description.
        range: LiMiObjectiveCorrectionCollarType
      dipping_medium:
        description:
          The Dipping Medium this Objective is compatible with (when the
          Immersion Type is set to "Dipping").
        # In case the Immersion Type for this Objective is designated as "Dipping", this field captures the type of Dipping Medium this Objective is compatible with. Examples include, water-based (biological buffers, culture media, other water-based solutions) organic-based [FocusClear (CLARITY); CUBIC-1, CUBIC-2, CUBIC-R1, CUBIC-R2; 2,2-thiodiethanol (TDE); ethyl cinnamate; Benzyl Benzoate and BB-PEG (PEGASOS); Benzyl Alcohol, Benzyl Benzoate (BABB); dibenzyl ether (DBE); 100% Ethanol].
        range: LiMiObjectiveDippingType
        notes:
          - FIXME Add a rule to forbid the use of this attribute when Immersion
            Type is _not_ "Dipping"?
      phase_contrast_designation:
        description:
          If this Objective is designed for Phase, this is the Phase Contrast
          designation of the Phase Plate found in this Objective. This
          designation has to match the Phase Number of the Phase Ring associated
          with the front focal plane of the Condenser.
        range: LiMiObjectivePhaseContrastDesignationType
        see_also:
          - https://www.microscopyu.com/techniques/phase-contrast/phase-contrast-Microscope-configuration
      objective_view_field:
        description:
          The maximal diameter of the view field allowed by this Objective,
          expressed in mm, and measured at the intermediate image plane.
        # This field records the maximal diameter of the view field allowed by this Objective, expressed in mm, and measured at the intermediate image plane. NB: The field of view is influenced by the magnification and diameter of the ocular (eyepiece) field diaphragm, but also by the limits imposed by the design of the Objective.
        range: float
      image_distance:
        description:
          The distance in air between the rear principal plane of this Objective
          and the primary Image plane.
        #This field records
        range: float
      image_distance_unit:
        description: Unit associated with the Image Distance value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      front_local_length:
        description:
          The distance measured along the optical axis from the front principal
          plane of this Lens to the front focal plane.
        # This field records the distance (f) measured along the optical axis from the front principal plane of this Lens to the front focal plane (F).
        range: float
      front_local_length_unit:
        description: Unit associated with the Front Focal Length value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      back_focal_length:
        description:
          The distance measured along the optical axis from the read principal
          plane of this Lens to the rear focal plane.
        # This field records the distance (f') measured along the optical axis from the rear principal plane of this Lens to the rear focal plane (F').
        range: float
      back_focal_length_unit:
        description: Unit associated with the Back Focal Length value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
      parfocalizing_distance:
        description:
          The distance between the mounting plane of this Objective and the
          specimen plane.
        # This field records...
        range: float
      parfocalizing_distance_unit:
        description: Unit associated with the Parfocalizing Distance value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)

  ###########
  # Filters AK
  ###########

  LiMiFilter:
    description:
      An optical Filter positioned in the Light Path for one or more Channels
      available for an Instrument. An optical Filter is a device designed to
      selectively control the Wavelengths, color temperature, vibration
      direction, and/or intensity of the radiation which it transmits or
      reflects.
    # This element describes an optical Filter positioned in the Light Path for one or more Channels available for this Instrument. An optical Filter is a device designed to selectively control the Wavelengths, color temperature, vibration direction, and/or intensity of the radiation which it transmits or reflects. An Instrument may have several Filters of different types, such as an Excitation, Emission, Neutral Density or an additional Generic Filter positioned in the Light Path for different purposes. For each fluorescence Image there should be at least one Filter element specified per Channel. This element can be associated with an optional Optics Holder, such as a Filter Cube, Filter Turret, Filtr Wheel, or Filter Slider. Note: Filter Holder is not the same as a Filter Set.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
      - object_type
    attributes:
      type:
        description:
          This field captures the Type of Filter used in this Instrument.
        range: LiMiFilterType
        required: true

      filter_holder_position:
        description:
          This field records the position of this element in a Filter Holder of
          any kind, such as a Filter Slider, Turret or Wheel.
        range: integer
        annotations:
          limi_tier: 2

      coating_method:
        description:
          This field records the type of Coating used in this case. An optical
          coating is one or more thin layers of material deposited on an optical
          component such as a Lens, Filter or Mirror, which alters the way in
          which the optic reflects and transmits light.
        range: LiMiFilterCoatingMethod
        required: true

      light_path_location:
        description:
          This field records the location of this component in the Microscope
          Light Path.
        range: LiMiFilterLightPathLocation
        required: true

      technology:
        description:
          This field records the filtering Technology utilized for this optical
          element. The main types of technologies used in fluorescence analysis
          are Absorption (aka colored) glass, Polymer or Thin-film coating.
        range: LiMiFilterTechnology
        annotations:
          limi_tier: 2

      attenuation_method:
        description:
          This field records the means by which this optical element achieves
          out-of-band transmission attenuation.
        range: LiMiFilterAttenuationMethod
        required: true
        annotations:
          limi_tier: 2

      attenuation_coefficient:
        description:
          This field records the Attenuation Coefficient (AC) of this optical
          element. The AC (aka blocking coefficient) is a material property that
          characterizes the degree to which light is being blocked (i.e.,
          scattered or absorbed) by it. AC is used as a measure of the
          out-of-band blocking of an optical Lens, Filter, Dichroic mirror over
          an extended range of the spectrum. AC is often reported in units of
          optical density (OD), whereas OD= -log10(T), and T=Transmittance
          (0≤T≤1).
        range: float
        annotations:
          limi_tier: 3

      diameter:
        description: This field describes the Diameter of this filter
        # This field describes the Diameter of this optical element
        range: float
        annotations:
          limi_tier: 3
      diameter_unit:
        description: unit associated with the filter diameter
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(cm)
        annotations:
          limi_tier: 3

      thickness:
        description: This field describes the Thickness of this filter
        # This field describes the Diameter of this optical element
        range: float
        annotations:
          limi_tier: 3
      thickness_unit:
        description: unit associated with the filter thickness
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(mm)
        annotations:
          limi_tier: 3
      angle_of_incidence:
        description:
          This field records the optimal angle of incidence (AOI) for this
          Filter. The AOI is the angle between the optical axis of the incident
          light and the axis normal to the surface of the Mirror. In specular
          reflection, AOI is by definition equal to the Angle Of Reflection
          (AOR).
        range: float
        annotations:
          limi_tier: 3
      angle_of_incidence_unit:
        description: unit associated with the filter angle_of_incidence
        range: LiMiAngleUnit
        ifabsent: LiMiAngleUnit(deg)
        annotations:
          limi_tier: 3

      polarization:
        description:
          This field records the polarization effect of this optical element.
          Any thin-film interference Coating that is used at non-normal
          angles-of-incidence will cause some amount of polarization, the
          precise effect varying greatly with wavelength and with the particular
          Coating design.
        range: LiMiFilterPolarization
        annotations:
          limi_tier: 3

  LiMiExcitationFilter:
    description:
      A Filter whose purpose is to selectively attenuate the Light that is
      utilized to Excite the Sample depending on Wavelength.
    # This element refers to an Excitation Filter whose purpose is to selectively attenuate the Light that is utilized to Excite the Sample depending on Wavelength. This element can be associated with an optional Filter Holder.
    is_a: LiMiFilter

  LiMiEmissionFilter:
    description:
      A Filter whose purpose is to selectively attenuate the Fluorescent Light
      that is emitted by the Sample dependent on Wavelength.
    # This element refers to an Emission Filter whose purpose is to selectively attenuate the Fluorescent Light that is emitted by the Sample depending on Wavelength. This element can be associated with an optional Filter Holder.
    is_a: LiMiFilter

  LiMiTransmittanceRange:
    description:
      A range of wavelength (also known as a Band) that are transmitted by an
      optical component. This also includes the maximum amount of light
      transmitted.
    # This element records the Range (also known as Band) of Wavelengths that are transmitted by this optical component. It also records the maximum amount of light transmitted. Multiple of these elements can be used.
    is_a: LiMiObject
    attributes:
      wavelength:
        description:
          The key Wavelength that characterizes this Transmittance Range (also
          known as Transmission Band). In the case of Bandpass, Bandstop,
          Multipass, or Notch Filters, Wavelength often refers to the Central
          Wavelength of each of the transmission band(s); alternatively, in case
          of a Longpass or a Shortpass Filter, Wavelength refers to the CutOn
          Wavelength (i.e., below which there is less then 50% transmittance) or
          the CutOff Wavelength (i.e., above which there is less than 50%
          transmittance) respectively. In the case of Dichroics, Wavelength most
          commonly refers to the Edge Wavelength which might be either the CutOn
          or the CutOff Wavelength depending on individual cases.
        # This field records...
        range: float
        required: true
        minimum_value: 0.0
      wavelength_unit:
        description: Unit associated with the Wavelength value.
        range: LiMiLengthUnit
        ifabsent: LiMiLengthUnit(nm)
      transmittance:
        description:
          The maximum of light this optical component is capable of transmitting
          in this Wavelength Range, at the Peak Wavelength. It is represented as
          a fractional value from 0.0 to 1.0.
        # This field records...
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        annotations:
          limi_tier: 2
      FWHM_bandwidth:
        description:
          The width of this Transmittance Range. Specifically, the Full Width at
          Half Maximum (FWHM) represents the bandwidth of the Wavelength
          spectrum curve measured between those points whose transmission
          amplitude is 50% of the maximum.
        range: float
        minimum_value: 0.0
        required: true
      FWHM_bandwidth_unit:
        description: Unit associated with the FWHM Bandwidth value.
        range: LiMiLengthUnit

  ############
  # Detector #
  ############

  LiMiDetector:
    description:
      A Detector available for this Instrument. An Instrument may have more than
      one Detector of different types, such as a Photomultiplier, or a Camera.
      The Detector ID can be used as a reference within the Channel element. The
      values stored in Detector represent the fixed values, variable values
      modified during the Acquisition go in DetectorSettings.
    is_a: LiMiManufacturerSpecs
    slots:
      - id
      - name
      - object_type
    attributes:
      mount:
        description:
          This field records the type of Mount used to connect this detector to
          the Microscope Stand.
        required: true
        range: LiMiDetectorMount
        annotations:
          limi_tier: 2
      max_bit_depth:
        description:
          This field records the Maximum Bit Depth provided by the Detector's
          Analog to Digital Converter (ADC; also referred to as Digitizer).
        required: true
        range: LiMiDetectorMaxBitDepth
        annotations:
          limi_tier: 2
      quantum_efficiency:
        description:
          This field records the Quantum Efficiency observed at Peak Wavelength,
          according to the Manufacturer. Quantum Efficiency is generally defined
          as is the ratio of incident photons to converted electrons. Typically
          expressed as a number between 0 and 1.
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
        range: float
        annotations:
          limi_tier: 2
      electron_conversion_factor:
        description:
          This field records the Electron-Conversion Factor for this Detector,
          as specified by the Manufacturer. The Electron Conversion Factor
          relates the actual number of electrons generated by the Detector with
          the digital number associated with each Pixel. It is expressed in
          electrons/Analog-to-Digital-Unit (ADU). Note that ADU can also be
          referred to as Digital Number (DN) or Binary Number. It is sometimes
          referred to as Digital Gain or, in case of CCD cameras as CCD Gain.
        required: true
        range: float
        annotations:
          limi_tier: 2
      readout_noise:
        description:
          This field captures the Read-out Noise associated with this Detector,
          as specified by the Manufacturer. Read-out Noise is a constant amount
          of noise and it includes thermal noise build-up and clock induced
          charge added by the CCD chip, the readout amplifier and surrounding
          electronics. It is generally expressed in photo-electrons (i.e., e-
          root-mean-square).
        required: true
        range: float
        annotations:
          limi_tier: 2
      readout_noise_unit:
        description: Unit associated with readout noise.
        range: LiMiElectricCurrentUnit
        ifabsent: LiMiElectricCurrentUnit(e- rms)
        annotations:
          limi_tier: 2
      detector_noise_model:
        description:
          This field records the Noise Model associated with this Detector.
        required: true
        range: LiMiDetectorNoiseModel
        annotations:
          limi_tier: 2
      dark_current_rate:
        description:
          This field records the Dark Current Rate of this Detector as specified
          by the Manufacturer. The Dark Current Rate is the median current
          detected in the absence of light. Generally expressed in e-/pixel/sec.
        required: true
        range: float
        annotations:
          limi_tier: 2
      dark_current_rate_unit:
        description: Unit associated with the dark current rate value
        range: LiMiElectricCurrentUnit
        ifabsent: LiMiElectricCurrentUnit(e-/pixel/s)
        annotations:
          limi_tier: 2
      dynamic_range:
        description:
          This field records the Dynamic Range for this detector in deciBel (dB)
        range: float
        annotations:
          limi_tier: 2
      dynamic_range_unit:
        description: Unit associated with the detector dynamic range.
        range: LiMiRatioUnit
        ifabsent: LiMiRatioUnit(dB)
        annotations:
          limi_tier: 2
      ambient_operating_temperature:
        description:
          This field records the Ambient Temperature at which this Detector is
          designed to operate, according to the Manufacturer.
        annotations:
          limi_tier: 3
        range: float
      ambient_operating_temperature_unit:
        description: Unit associated with the ambient operating temperature.
        range: LiMiTemperatureUnit
        #AK: I added this to core units
        ifabsent: LiMiTemperatureUnit(C)
        annotations:
          limi_tier: 3
      ambient_operating_humidity:
        description:
          This field records the Ambient Humidity at which this detector is
          designed to operate, according to the Manufacturer.
        annotations:
          limi_tier: 2
        range: float
      relay_lens_ref:
        description:
          This field contains a reference to a Lens positioned at the Mount
          connecting this Detector to the Microscope Stand.
        range: LiMiLens
        #AK: we do not need to have this range here, right?
        inlined: false
      wavelength_range:
        description:
          This element records the Range of Wavelengths this device is designed
          for, according to the Manufacturer. Multiple of this element may be
          used.
        range: LiMiWavelengthRange
        annotations:
          limi_tier: 2

