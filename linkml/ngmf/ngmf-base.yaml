id: https://schemas.incenp.org/ngmf/v1/base/
name: ngmf-base
title: Next Generation Metadata Framework Base Schema
description: >-
  Base schema for the Next Generation Metadata Framework scheme.
created_by: orcid:0000-0002-6095-8718

prefixes:
  linkml: https://w3id.org/linkml/
  ngmf: https://schemas.incenp.org/ngmf/v1/base/
  orcid: https://orcid.org/
imports:
  - linkml:types
default_prefix: ngmf
default_range: string

slots:
  extension_type:
    description: The type designator for a class extension object.
    range: uri
    designates_type: true
    key: true

classes:
  IsExtensibleMixin:
    description: An object that can carry arbitrary class extension objects.

      Reuse this mixin in any class to allow the class to be extended with class
      extensions.
    mixin: true
    attributes:
      extensions:
        description: The collection of class extension objects.
        range: BaseExtensionObject
        multivalued: true
        inlined: true
        inlined_as_list: false

  BaseExtensionObject:
    description:
      Represents a class extension object, that is a fragment of an object that
      is defined by an extension rather than by the base schema.
    slots:
      - extension_type
    extra_slots:
      allowed: true
